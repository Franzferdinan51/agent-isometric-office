<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenClaw Agent Office - Isometric 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #050510; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
#office-canvas { display: block; position: fixed; top: 0; left: 0; }
#panels { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 100; transition: opacity 0.3s; }
#panels.hidden { opacity: 0; pointer-events: none; }
.panel { background: rgba(10,10,30,0.85); border: 1px solid rgba(100,150,255,0.2); border-radius: 10px; padding: 10px 14px; color: #e0e0e0; font-size: 12px; backdrop-filter: blur(8px); }
.panel-title { font-weight: 700; color: #88aacc; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
.agent-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.agent-dot { width: 8px; height: 8px; border-radius: 50%; background: #00ffaa; box-shadow: 0 0 6px #00ffaa; }
.agent-name { color: #ccc; font-size: 12px; }
#weather-widget { position: fixed; top: 20px; right: 20px; background: rgba(10,10,30,0.9); border: 1px solid rgba(100,150,255,0.25); border-radius: 10px; padding: 12px 16px; color: #e0e0e0; font-size: 13px; z-index: 200; min-width: 200px; backdrop-filter: blur(8px); }
.wx-city { font-weight: 700; font-size: 12px; color: #88aacc; margin-bottom: 6px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.wx-city:hover { color: #aaccee; }
.wx-main { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.wx-temp { font-size: 28px; font-weight: 700; color: #fff; }
.wx-emoji { font-size: 28px; }
.wx-desc { font-size: 12px; color: #999; margin-bottom: 4px; }
.wx-detail { font-size: 11px; color: #777; }
.wx-edit { display: none; margin-top: 6px; }
.wx-edit input { background: rgba(255,255,255,0.1); border: 1px solid rgba(100,150,255,0.3); border-radius: 6px; color: #fff; padding: 4px 8px; font-size: 12px; width: 130px; outline: none; }
.wx-edit button { background: rgba(100,150,255,0.3); border: none; border-radius: 4px; color: #fff; padding: 4px 8px; font-size: 11px; cursor: pointer; margin-left: 4px; }
.wx-loading { font-size: 11px; color: #888; }
.wx-error { font-size: 11px; color: #f66; }
#settings-btn { position: fixed; bottom: 20px; right: 20px; background: rgba(10,10,30,0.85); border: 1px solid rgba(100,150,255,0.25); border-radius: 50%; width: 44px; height: 44px; color: #88aacc; font-size: 20px; cursor: pointer; z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); transition: background 0.2s; }
#settings-btn:hover { background: rgba(30,30,60,0.9); }
#time-display { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(10,10,30,0.85); border: 1px solid rgba(100,150,255,0.2); border-radius: 20px; padding: 6px 16px; color: #fff; font-size: 13px; font-weight: 600; z-index: 200; backdrop-filter: blur(8px); letter-spacing: 0.5px; }
</style>
</head>
<body>
<canvas id="office-canvas"></canvas>

<div id="time-display">--:--:-- --</div>

<div id="weather-widget">
  <div class="wx-city" id="wx-city-wrap" title="Click to change">&#128205; <span id="wx-city">Loading...</span></div>
  <div id="wx-content"><div class="wx-loading">Fetching...</div></div>
  <div class="wx-edit" id="wx-edit"><input type="text" id="wx-city-input" placeholder="City"><button id="wx-save-btn">Save</button></div>
</div>

<div id="panels">
  <div class="panel" id="session-panel">
    <div class="panel-title">&#9670; Agents Online</div>
    <div id="agent-list"><span style="color:#777">Loading...</span></div>
  </div>
</div>

<button id="settings-btn" title="Toggle panels">&#9881;</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================================================================
// CONFIG & SHARED STATE
// ================================================================
const CONFIG = {
  gatewayUrl: 'http://localhost:18790',
  pollInterval: 3000,
  agentCount: 6
};

const officeObjects = {
  monitors: [],
  plants: [],
  lamps: [],
  blinkLights: [],
  chairs: [],
  desks: [],
  steamParticles: []
};

let scene, camera, renderer, controls;

// ================================================================
// HELPERS
// All geometry helpers create CENTERED meshes.
// Bottom of object at world y = group.y + local_y_offset - h/2
// ================================================================
const L = g => g.children[g.children.length - 1];
const add = (p, m) => p.add(m);

function mkMat(c, opts = {}) {
  return new THREE.MeshStandardMaterial(Object.assign({ color: c }, opts));
}

function mkBox(w, h, d, c, opts = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mkMat(c, opts));
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function mkCyl(rt, rb, h, segs, c, opts = {}) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, segs), mkMat(c, opts));
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function mkSphere(r, segs, c, opts = {}) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, segs, segs), mkMat(c, opts));
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// ================================================================
// SCENE SETUP
// ================================================================
function initScene() {
  const aspect = window.innerWidth / window.innerHeight;
  const frustumSize = 100;
  camera = new THREE.OrthographicCamera(
    frustumSize * aspect / -2, frustumSize * aspect / 2,
    frustumSize / 2, frustumSize / -2,
    0.1, 1000
  );
  camera.position.set(60, 60, 60);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('office-canvas'), antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x050510);

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x050510, 100, 250);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 0, 0);

  // Lighting
  const ambient = new THREE.AmbientLight(0x404060, 0.5);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xffeedd, 0.9);
  sun.position.set(50, 80, 50);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 300;
  sun.shadow.camera.left = -100;
  sun.shadow.camera.right = 100;
  sun.shadow.camera.top = 100;
  sun.shadow.camera.bottom = -100;
  scene.add(sun);

  const fill = new THREE.DirectionalLight(0x8899cc, 0.4);
  fill.position.set(-50, 40, -50);
  scene.add(fill);
}

// ================================================================
// FURNITURE CREATION FUNCTIONS
// All desk-surface objects sit with their BOTTOM at world y=1.6
// ================================================================

function createDeskLamp() {
  const g = new THREE.Group();
  // Base: cylinder h=0.1, centered at y=0.05 → bottom at y=0 (group bottom = desk surface)
  const baseMat = mkMat(0x444444);
  const base = mkCyl(0.15, 0.2, 0.1, 16, 0x444444);
  base.position.y = 0.05;
  g.add(base);
  // Pole: cylinder h=0.6, centered at y=0.05+0.3=0.35
  const pole = mkCyl(0.03, 0.03, 0.6, 8, 0x555555);
  pole.position.y = 0.35;
  g.add(pole);
  // Shade/bulb: cone h=0.2, at y=0.75, emissive
  const headMat = new THREE.MeshStandardMaterial({ color: 0x666666, emissive: 0xffffaa, emissiveIntensity: 0.3 });
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.2, 16), headMat);
  head.position.y = 0.75;
  head.rotation.x = Math.PI;
  g.add(head);
  g.userData.isLamp = true;
  return g;
}

function createPlant() {
  const g = new THREE.Group();
  // Pot: cylinder h=0.25, centered at y=0.125 → bottom at y=0 (sits on surface)
  const pot = mkCyl(0.15, 0.12, 0.25, 16, 0x8B4513);
  pot.position.y = 0.125;
  g.add(pot);
  // 5 leaf spheres around top
  const leafMat = mkMat(0x228B22);
  for (let i = 0; i < 5; i++) {
    const leaf = mkSphere(0.12, 8, 0x228B22);
    const angle = (i / 5) * Math.PI * 2;
    leaf.position.set(Math.cos(angle) * 0.1, 0.35 + Math.random() * 0.1, Math.sin(angle) * 0.1);
    leaf.scale.y = 1.3;
    g.add(leaf);
  }
  g.userData.isPlant = true;
  return g;
}

function createCoffeeMug() {
  const g = new THREE.Group();
  // Body: cylinder h=0.35, centered at y=0.175 → bottom at y=0
  const body = mkCyl(0.15, 0.12, 0.35, 16, 0xcc4444);
  body.position.y = 0.175;
  g.add(body);
  // Handle: torus
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.025, 8, 16, Math.PI), mkMat(0xcc4444));
  handle.rotation.y = Math.PI / 2;
  handle.position.set(0.18, 0.18, 0);
  g.add(handle);
  g.userData.hasSteam = true;
  return g;
}

function createMonitor() {
  const g = new THREE.Group();
  // Stand
  const stand = mkBox(0.4, 0.6, 0.3, 0x2a2a2a);
  stand.position.y = 0.3;
  g.add(stand);
  // Screen bezel
  const bezel = mkBox(2.0, 1.3, 0.08, 0x111122);
  bezel.position.y = 1.1;
  g.add(bezel);
  // Screen (emissive)
  const screenMat = new THREE.MeshStandardMaterial({ color: 0x111122, emissive: 0x111122, emissiveIntensity: 0.8 });
  const screen = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.1, 0.02), screenMat);
  screen.position.y = 1.1;
  screen.position.z = 0.045;
  g.add(screen);
  g.userData.isMonitor = true;
  return g;
}

function createChair() {
  const g = new THREE.Group();
  const seatMat = mkMat(0x333344);
  // Seat
  const seat = mkBox(0.9, 0.1, 0.9, 0x333344);
  seat.position.y = 0.9;
  g.add(seat);
  // Back
  const back = mkBox(0.9, 0.8, 0.1, 0x333344);
  back.position.set(0, 1.35, -0.4);
  g.add(back);
  // Legs
  [[-0.35, 0.45, -0.35], [0.35, 0.45, -0.35], [-0.35, 0.45, 0.35], [0.35, 0.45, 0.35]].forEach(p => {
    const leg = mkCyl(0.04, 0.04, 0.9, 8, 0x222233);
    leg.position.set(p[0], p[1], p[2]);
    g.add(leg);
  });
  return g;
}

function createDesk() {
  const g = new THREE.Group();
  // Desk surface: box h=0.2, centered at y=1.7 → top at y=1.8, bottom at y=1.6
  const surface = mkBox(4.5, 0.2, 2.5, 0x4a3728, { roughness: 0.7 });
  surface.position.y = 1.7;
  g.add(surface);
  // Legs
  [[-2, 0.8, -1.1], [2, 0.8, -1.1], [-2, 0.8, 1.1], [2, 0.8, 1.1]].forEach(p => {
    const leg = mkBox(0.15, 1.6, 0.15, 0x333333);
    leg.position.set(p[0], p[1], p[2]);
    g.add(leg);
  });
  return g;
}

// ================================================================
// ROOM CREATION
// All floor-hugging objects: bottom at world y=0
// ================================================================

function createMainOffice() {
  const g = new THREE.Group();
  g.position.set(0, 0, 0);

  // Floor
  const floor = mkBox(90, 0.2, 90, 0x1a1a2e, { roughness: 0.8 });
  floor.position.y = -0.1;
  floor.receiveShadow = true;
  g.add(floor);

  // Floor grid overlay (checker pattern using thin boxes)
  for (let x = -40; x <= 40; x += 5) {
    for (let z = -40; z <= 40; z += 5) {
      if ((Math.floor(x / 5) + Math.floor(z / 5)) % 2 === 0) {
        const tile = mkBox(4.8, 0.01, 4.8, 0x1e1e32, { roughness: 0.9 });
        tile.position.set(x, 0.01, z);
        tile.receiveShadow = true;
        g.add(tile);
      }
    }
  }

  // Walls
  const wallMat = mkMat(0x2a2a4a, { roughness: 0.6 });
  const wallH = 8;
  // Back wall (z = -45)
  const backWall = mkBox(90, wallH, 0.5, 0x2a2a4a);
  backWall.position.set(0, wallH / 2, -45);
  g.add(backWall);
  // Left wall (x = -45)
  const leftWall = mkBox(0.5, wallH, 90, 0x2a2a4a);
  leftWall.position.set(-45, wallH / 2, 0);
  g.add(leftWall);
  // Right wall (x = 45)
  const rightWall = mkBox(0.5, wallH, 90, 0x2a2a4a);
  rightWall.position.set(45, wallH / 2, 0);
  g.add(rightWall);
  // Front wall sections (with door gap)
  const frontLeft = mkBox(20, wallH, 0.5, 0x2a2a4a);
  frontLeft.position.set(-35, wallH / 2, 45);
  g.add(frontLeft);
  const frontRight = mkBox(20, wallH, 0.5, 0x2a2a4a);
  frontRight.position.set(35, wallH / 2, 45);
  g.add(frontRight);
  const frontTop = mkBox(20, wallH - 4, 0.5, 0x2a2a4a);
  frontTop.position.set(0, wallH - (wallH - 4) / 2, 45);
  g.add(frontTop);

  // Ceiling fluorescent lights
  for (let x = -30; x <= 30; x += 15) {
    for (let z = -30; z <= 30; z += 15) {
      const fixture = mkBox(3, 0.1, 1, 0xeeeeff, { emissive: 0xeeeeff, emissiveIntensity: 0.6 });
      fixture.position.set(x, 7.95, z);
      g.add(fixture);
      const pl = new THREE.PointLight(0xeeeeff, 0.5, 15);
      pl.position.set(x, 7.5, z);
      g.add(pl);
      officeObjects.blinkLights.push(fixture);
    }
  }

  // Reception / info desk
  const deskGroup = new THREE.Group();
  deskGroup.add(mkBox(8, 1.1, 2.5, 0x4a3728, { roughness: 0.6 }));
  L(deskGroup).position.y = 0.55;
  // Countertop accent
  const acc = mkBox(8.2, 0.08, 2.6, 0x00ffaa, { emissive: 0x00ffaa, emissiveIntensity: 0.4 });
  acc.position.y = 1.14;
  deskGroup.add(acc);
  deskGroup.position.set(0, 0, -20);
  g.add(deskGroup);

  // Desk cluster - 6 desks in 2 rows of 3
  // Desk surface top = world y=1.6
  const deskPositions = [
    { x: -30, z: -25 }, { x: -30, z: -8 }, { x: -30, z: 9 },
    { x: -6, z: -25 }, { x: -6, z: -8 }, { x: -6, z: 9 }
  ];

  deskPositions.forEach((dp, i) => {
    const dg = new THREE.Group();
    dg.position.set(dp.x, 0, dp.z);

    // Desk
    const desk = createDesk();
    dg.add(desk);
    officeObjects.desks.push(desk);

    // Monitor
    const mon = createMonitor();
    mon.position.set(0, 1.8, -0.5);
    dg.add(mon);
    officeObjects.monitors.push(mon);

    // Chair (in front of desk)
    const chair = createChair();
    chair.position.set(0, 0, dp.z + 2.5);
    chair.rotation.y = Math.PI;
    dg.add(chair);
    officeObjects.chairs.push(chair);

    // Desk lamp
    const lamp = createDeskLamp();
    lamp.position.set(-1.5, 1.6, -0.5); // Bottom at desk surface y=1.6
    dg.add(lamp);
    officeObjects.lamps.push(lamp);

    // Coffee mug
    const mug = createCoffeeMug();
    mug.position.set(1.5, 1.6, -0.8); // Bottom at desk surface y=1.6
    dg.add(mug);

    // Plant on every other desk
    if (i % 2 === 0) {
      const plant = createPlant();
      plant.position.set(-1.5, 1.6, 0.8); // Bottom at desk surface y=1.6
      dg.add(plant);
      officeObjects.plants.push(plant);
    }

    g.add(dg);
  });

  scene.add(g);
  return g;
}

// ================================================================
// LOUNGE AREA
// ================================================================
function createLoungeArea() {
  const g = new THREE.Group();
  g.position.set(0, 0, 22);

  // Floor
  const floor = mkBox(20, 0.2, 16, 0x3a3a5a, { roughness: 0.7 });
  floor.position.y = -0.1;
  g.add(floor);

  // Tile floor pattern
  for (let x = -9; x <= 9; x += 2) {
    for (let z = -7; z <= 7; z += 2) {
      if ((Math.floor(x / 2) + Math.floor(z / 2)) % 2 === 0) {
        const tile = mkBox(1.9, 0.02, 1.9, 0x3e3e50);
        tile.position.set(x, 0.01, z);
        g.add(tile);
      }
    }
  }

  // Walls
  const wMat = mkMat(0x3a4555);
  const backW = mkBox(20, 8, 0.5, 0x3a4555);
  backW.position.set(0, 4, -8);
  g.add(backW);
  const leftW = mkBox(0.5, 8, 16, 0x3a4555);
  leftW.position.set(-10, 4, 0);
  g.add(leftW);
  const rightW = mkBox(0.5, 8, 16, 0x3a4555);
  rightW.position.set(10, 4, 0);
  g.add(rightW);

  // Sofa
  const sofaG = new THREE.Group();
  const sofaMat = mkMat(0x4a4a6a);
  sofaG.add(mkBox(7, 0.8, 2.2, 0x4a4a6a));
  L(sofaG).position.y = 0.4;
  const sofaBack = mkBox(7, 0.6, 0.2, 0x4a4a6a);
  sofaBack.position.set(0, 0.7, -1.0);
  sofaG.add(sofaBack);
  const armL = mkBox(0.2, 0.5, 2.2, 0x4a4a6a);
  armL.position.set(-3.4, 0.45, 0);
  sofaG.add(armL);
  const armR = armL.clone();
  armR.position.set(3.4, 0.45, 0);
  sofaG.add(armR);
  sofaG.position.set(0, 0, -2);
  g.add(sofaG);

  // Coffee table
  const ctG = new THREE.Group();
  ctG.add(mkBox(3, 0.12, 1.5, 0x3d2817));
  L(ctG).position.y = 0.8;
  const ctLeg = (x, z) => {
    const leg = mkCyl(0.06, 0.06, 0.8, 8, 0x555555);
    leg.position.set(x, 0.4, z);
    ctG.add(leg);
  };
  ctLeg(-1.2, -0.5); ctLeg(1.2, -0.5); ctLeg(-1.2, 0.5); ctLeg(1.2, 0.5);
  ctG.position.set(0, 0, 1);
  g.add(ctG);

  // Large floor plants
  const addTree = (x, z) => {
    const treeG = new THREE.Group();
    // Pot: h=0.85, centered at y=0.425 → bottom at y=0 (floor level)
    treeG.add(mkCyl(0.5, 0.4, 0.85, 12, 0x8B4513));
    L(treeG).position.y = 0.425;
    // Trunk: h=2.5, centered at y=1.25+0.425=1.675
    treeG.add(mkCyl(0.15, 0.2, 2.5, 8, 0x6B4226));
    L(treeG).position.y = 1.675;
    // Main foliage: r=1.0, centered at y=2.5+0.425=2.925
    treeG.add(mkSphere(1.0, 10, 0x228B22));
    L(treeG).position.y = 2.925;
    // Side foliage
    const s1 = mkSphere(0.7, 8, 0x2B8B2B);
    s1.position.set(0.5, 3.2, 0.3);
    treeG.add(s1);
    const s2 = mkSphere(0.6, 8, 0x1B6B1B);
    s2.position.set(-0.4, 3.0, -0.3);
    treeG.add(s2);
    treeG.position.set(x, 0, z);
    g.add(treeG);
  };
  addTree(7, -5);
  addTree(-7, -5);

  scene.add(g);
}

// ================================================================
// SERVER ROOM
// ================================================================
function createServerRoom() {
  const g = new THREE.Group();
  g.position.set(-45, 0, 0);

  // Floor
  const floor = mkBox(24, 0.2, 24, 0x1a1a2e);
  floor.position.y = -0.1;
  g.add(floor);

  // Walls
  const wMat = mkMat(0x1e2e3e);
  const backW = mkBox(24, 8, 0.5, 0x1e2e3e);
  backW.position.set(0, 4, -12);
  g.add(backW);
  const leftW = mkBox(0.5, 8, 24, 0x1e2e3e);
  leftW.position.set(-12, 4, 0);
  g.add(leftW);
  const rightW = mkBox(0.5, 8, 24, 0x1e2e3e);
  rightW.position.set(12, 4, 0);
  g.add(rightW);

  // Server racks
  for (let r = 0; r < 3; r++) {
    const rackG = new THREE.Group();
    // Rack frame
    rackG.add(mkBox(3, 6, 1.5, 0x222233));
    L(rackG).position.y = 3;
    // Server units (blades)
    for (let u = 0; u < 6; u++) {
      const unit = mkBox(2.6, 0.6, 1.3, 0x1a1a2a);
      unit.position.y = 0.5 + u * 0.9;
      rackG.add(unit);
      // Status lights
      const light = mkSphere(0.08, 6, 0x00ff44, { emissive: 0x00ff44, emissiveIntensity: 1.0 });
      light.position.set(0.8, 0.5 + u * 0.9, 0.7);
      rackG.add(light);
      officeObjects.blinkLights.push(light);
      const light2 = mkSphere(0.06, 6, 0xffaa00, { emissive: 0xffaa00, emissiveIntensity: 0.8 });
      light2.position.set(1.0, 0.5 + u * 0.9, 0.7);
      rackG.add(light2);
      officeObjects.blinkLights.push(light2);
    }
    rackG.position.set(-6 + r * 6, 0, -9);

// ================================================================
// ANIMATIONS — null-safe, wrapped in try-catch
// ================================================================
function updateAnimations(time) {
  try {
    // Monitor screens flicker
    officeObjects.monitors.forEach((mon, i) => {
      if (!mon || !mon.userData || !mon.userData.isMonitor) return;
      if (!mon.children[1] || !mon.children[1].material) return;
      const flicker = 0.7 + Math.sin(time * 2 + i) * 0.15 + Math.random() * 0.1;
      mon.children[1].material.emissiveIntensity = flicker;
    });

    // Plants sway gently
    officeObjects.plants.forEach((plant, i) => {
      if (!plant || !plant.userData || !plant.userData.isPlant) return;
      plant.rotation.z = Math.sin(time * 0.5 + i) * 0.03;
      plant.rotation.x = Math.cos(time * 0.4 + i) * 0.02;
    });

    // Lamps pulse
    officeObjects.lamps.forEach((lamp, i) => {
      if (!lamp || !lamp.userData || !lamp.userData.isLamp) return;
      if (!lamp.children[2] || !lamp.children[2].material) return;
      const pulse = 0.2 + Math.sin(time * 0.5 + i) * 0.15;
      lamp.children[2].material.emissiveIntensity = pulse;
    });

    // Blink lights (server room status)
    officeObjects.blinkLights.forEach((bl, i) => {
      if (!bl || !bl.material) return;
      bl.material.emissiveIntensity = (Math.sin(time * 2 + i * 1.7) > 0.3) ? 1.0 : 0.1;
    });
  } catch (e) {
    // Swallow — prevents any animation crash
  }
}

// ================================================================
// WEATHER — Fahrenheit + mph
// ================================================================
function initWeather() {
  const defaultCity = localStorage.getItem('ducklabs_city') || 'Huber Heights,OH';
  document.getElementById('wx-city').textContent = defaultCity;
  fetchWx(defaultCity);
  setInterval(() => fetchWx(defaultCity), 600000);

  document.getElementById('wx-city-wrap').addEventListener('click', () => {
    const editor = document.getElementById('wx-edit');
    editor.style.display = editor.style.display === 'block' ? 'none' : 'block';
    if (editor.style.display === 'block') {
      document.getElementById('wx-city-input').value = defaultCity;
      document.getElementById('wx-city-input').focus();
    }
  });

  document.getElementById('wx-save-btn').addEventListener('click', () => {
    const v = document.getElementById('wx-city-input').value.trim();
    if (v) {
      localStorage.setItem('ducklabs_city', v);
      document.getElementById('wx-city').textContent = v;
      document.getElementById('wx-edit').style.display = 'none';
      fetchWx(v);
    }
  });

  document.getElementById('wx-city-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('wx-save-btn').click();
    if (e.key === 'Escape') document.getElementById('wx-edit').style.display = 'none';
  });
}

function fetchWx(city) {
  const icons = {
    'Clear': '☀️', 'Sunny': '☀️', 'Partly cloudy': '⛅', 'Cloudy': '☁️',
    'Overcast': '☁️', 'Mist': '🌫️', 'Fog': '🌫️', 'Light rain': '🌧️',
    'Moderate rain': '🌧️', 'Heavy rain': '🌧️', 'Rain': '🌧️',
    'Light snow': '🌨️', 'Snow': '❄️', 'Thunderstorm': '⛈️'
  };
  const icon = d => icons[d] || '🌡️';

  fetch('https://wttr.in/' + encodeURIComponent(city) + '?format=j1', { signal: AbortSignal.timeout(5000) })
    .then(r => { if (!r.ok) throw 'bad'; return r.json(); })
    .then(j => {
      const c = j.current_condition[0];
      const tempF = c.temp_F !== undefined ? c.temp_F : Math.round((parseInt(c.temp_C) * 9 / 5) + 32);
      const windMph = c.windspeedMiles !== undefined ? c.windspeedMiles : Math.round(parseInt(c.windspeedKmph) * 0.621);
      document.getElementById('wx-content').innerHTML =
        '<div class="wx-main"><span class="wx-emoji">' + icon(c.weatherDesc[0].value) + '</span><span class="wx-temp">' + tempF + '°F</span></div>' +
        '<div class="wx-desc">' + c.weatherDesc[0].value + '</div>' +
        '<div class="wx-detail">💧 ' + c.humidity + '% humidity  🌬️ ' + windMph + ' mph</div>';
    })
    .catch(() => {
      document.getElementById('wx-content').innerHTML =
        '<div class="wx-error">Weather unavailable</div><div class="wx-detail">Click city to change</div>';
    });
}

// ================================================================
// SESSION POLLING
// ================================================================
function initSessionsPanel() {
  pollGateway();
  setInterval(pollGateway, CONFIG.pollInterval);
}

async function pollGateway() {
  try {
    const r = await fetch(CONFIG.gatewayUrl + '/sessions', { signal: AbortSignal.timeout(3000) });
    if (!r.ok) throw 'not ok';
    const data = await r.json();
    const sessions = data.sessions || [];
    const names = [...new Set(sessions.map(s => s.model || 'Agent').filter(Boolean))];
    const html = names.length > 0
      ? names.map(n => '<div class="agent-row"><span class="agent-dot"></span><span class="agent-name">' + n + '</span></div>').join('')
      : '<span style="color:#777">' + CONFIG.agentCount + ' agents online</span>';
    document.getElementById('agent-list').innerHTML = html;
  } catch {
    document.getElementById('agent-list').innerHTML = '<span style="color:#777">' + CONFIG.agentCount + ' agents online</span>';
  }
}

// ================================================================
// REAL-TIME CLOCK
// ================================================================
function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes().toString().padStart(2, '0');
  const s = now.getSeconds().toString().padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = (h % 12 || 12);
  document.getElementById('time-display').textContent = h12 + ':' + m + ':' + s + ' ' + ampm;
}
setInterval(updateClock, 1000);
updateClock();

// ================================================================
// ANIMATE LOOP
// ================================================================
function animate() {
  requestAnimationFrame(animate);
  const time = performance.now() * 0.001;
  controls.update();
  updateAnimations(time);
  renderer.render(scene, camera);
}

// ================================================================
// INIT
// ================================================================
function init() {
  initScene();
  createMainOffice();
  createLoungeArea();
  createServerRoom();
  createKitchen();
  createMeetingRoom();
  createRooftop();
  createSupplyCloset();
  createOutdoorTrees();
  initWeather();
  initSessionsPanel();
  window.addEventListener('resize', () => {
    const aspect = window.innerWidth / window.innerHeight;
    const frustumSize = 100;
    camera.left = frustumSize * aspect / -2;
    camera.right = frustumSize * aspect / 2;
    camera.top = frustumSize / 2;
    camera.bottom = frustumSize / -2;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  document.getElementById('settings-btn').addEventListener('click', () => {
    document.getElementById('panels').classList.toggle('hidden');
  });
  animate();
}

try {
  init();
  console.log('OFFICE: init complete');
} catch (e) {
  document.body.insertAdjacentHTML('beforeend',
    '<div style="position:fixed;top:0;left:0;background:#300;color:#fff;padding:20px;font-family:monospace;z-index:9999">ERROR: ' + e.message + '</div>');
}
