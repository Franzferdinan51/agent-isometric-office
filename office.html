<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OpenClaw Agent Office - Isometric 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0a0a0f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#canvas-container{width:100vw;height:100vh;position:relative}
canvas{display:block}
#agent-panel{position:fixed;top:20px;right:20px;background:rgba(10,10,20,.95);border:1px solid rgba(100,150,255,.3);border-radius:12px;padding:20px;min-width:280px;color:#e0e0e0;display:none;z-index:100}
#agent-panel.visible{display:block}
#agent-panel h2{font-size:18px;margin-bottom:12px;color:#fff}
.status-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.info-label{color:#888;font-size:13px}
.info-value{color:#fff;font-size:13px}
.close-btn{position:absolute;top:10px;right:10px;background:none;border:none;color:#666;font-size:20px;cursor:pointer}
#activity-ticker{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(10,10,20,.9);border:1px solid rgba(100,150,255,.2);border-radius:8px;padding:10px 20px;color:#0f0;font-family:'Monaco',monospace;font-size:13px;min-width:400px;max-width:600px;overflow:hidden;z-index:100}
#ticker-content{white-space:nowrap;animation:ticker-scroll 20s linear infinite}
@keyframes ticker-scroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
#time-indicator{position:fixed;top:20px;left:20px;background:rgba(10,10,20,.9);border:1px solid rgba(100,150,255,.2);border-radius:8px;padding:12px 16px;color:#e0e0e0;font-size:13px;z-index:100}
#time-slider{width:150px}
#connection-status{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(10,10,20,.9);border-radius:8px;padding:8px 16px;color:#0f0;font-size:12px;z-index:100;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#0f0;animation:pulse 2s infinite}
.disconnected .dot{background:#f00;animation:none}.disconnected{color:#f00}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#legend{position:fixed;bottom:80px;left:20px;background:rgba(10,10,20,.9);border:1px solid rgba(100,150,255,.2);border-radius:8px;padding:12px 16px;color:#e0e0e0;font-size:12px;z-index:100}
.legend-item{display:flex;align-items:center;gap:8px;margin:4px 0}
.legend-color{width:12px;height:12px;border-radius:50%}
#instructions{position:fixed;bottom:20px;right:20px;background:rgba(10,10,20,.8);border-radius:8px;padding:10px 14px;color:#888;font-size:11px;z-index:100}
.speech-bubble{position:fixed;background:rgba(15,15,30,.92);border:1px solid rgba(100,150,255,.4);border-radius:12px;padding:6px 10px;color:#e8e8ff;font-size:12px;pointer-events:none;transform:translateX(-50%);z-index:200;animation:bubble-pop .25s}
.speech-bubble::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid rgba(15,15,30,.92)}
@keyframes bubble-pop{from{opacity:0;transform:translateX(-50%) scale(.8) translateY(4px)}to{opacity:1;transform:translateX(-50%) scale(1) translateY(0)}}
#weather-widget{position:fixed;top:20px;right:20px;background:rgba(10,10,30,.9);border:1px solid rgba(100,150,255,.25);border-radius:10px;padding:12px 16px;color:#e0e0e0;font-size:13px;z-index:200;min-width:180px;backdrop-filter:blur(8px)}
#weather-widget .wx-city{font-weight:700;font-size:12px;color:#88aacc;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:4px}
#weather-widget .wx-city:hover{color:#aaccee}
#weather-widget .wx-main{display:flex;align-items:center;gap:8px;margin-bottom:4px}
#weather-widget .wx-temp{font-size:28px;font-weight:700;color:#fff}
#weather-widget .wx-emoji{font-size:28px}
#weather-widget .wx-desc{font-size:12px;color:#999;margin-bottom:4px}
#weather-widget .wx-detail{font-size:11px;color:#777}
#weather-widget .wx-edit{display:none;margin-top:6px}
#weather-widget .wx-edit input{background:rgba(255,255,255,.1);border:1px solid rgba(100,150,255,.3);border-radius:6px;color:#fff;padding:4px 8px;font-size:12px;width:130px;outline:none}
#weather-widget .wx-edit button{background:rgba(100,150,255,.3);border:none;border-radius:4px;color:#fff;padding:4px 8px;font-size:11px;cursor:pointer;margin-left:4px}
#weather-widget .wx-loading{font-size:11px;color:#888}
#weather-widget .wx-error{font-size:11px;color:#f66}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="connection-status"><div class="dot"></div><span id="status-text">Duck Labs</span></div>
<button id="settings-btn" aria-label="Settings">&#9881;</button>
<div id="weather-widget"><div class="wx-city" id="wx-city-wrap" title="Click to change">&#128205; <span id="wx-city">Loading...</span></div><div id="wx-content"><div class="wx-loading">Fetching...</div></div><div class="wx-edit" id="wx-edit"><input type="text" id="wx-city-input" placeholder="City"><button id="wx-save-btn">Save</button></div></div>
<div id="time-indicator"><div class="time-label" id="time-label">Day 12:00</div><input type="range" id="time-slider" min="0" max="24" step="0.5" value="12"></div>
<div id="agent-panel"><button class="close-btn" onclick="closeAgentPanel()">x</button>
<h2><span id="agent-emoji">E</span> <span id="agent-name">Agent</span></h2>
<div class="info-row"><span class="info-label">Status</span><span class="info-value"><span class="status-badge" id="agent-status">Active</span></span></div>
<div class="info-row"><span class="info-label">Model</span><span class="info-value" id="agent-model">-</span></div>
<div class="info-row"><span class="info-label">Tokens</span><span class="info-value" id="agent-tokens">-</span></div>
<div class="info-row"><span class="info-label">Task</span><span class="info-value" id="agent-task">-</span></div>
</div>
<div id="activity-ticker"><div id="ticker-content">OpenClaw Agent Office initialized</div></div>
<div id="legend"><h4>Office Zones</h4>
<div class="legend-item"><div class="legend-color" style="background:#4488ff"></div> Main Office</div>
<div class="legend-item"><div class="legend-color" style="background:#00ccff"></div> Server Room</div>
<div class="legend-item"><div class="legend-color" style="background:#ff44aa"></div> Gaming Lounge</div>
<div class="legend-item"><div class="legend-color" style="background:#ff8844"></div> Kitchen</div>
<div class="legend-item"><div class="legend-color" style="background:#44ff88"></div> Rooftop</div>
<div class="legend-item"><div class="legend-color" style="background:#ffcc00"></div> Executive Office</div>
<div class="legend-item"><div class="legend-color" style="background:#888888"></div> Supply Closet</div>
<div class="legend-item"><div class="legend-color" style="background:#aaaaaa"></div> Hallway</div>
</div>
<div id="instructions">Drag to orbit / Scroll to zoom / Click agent</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script>


const CONFIG={gatewayUrl:'http://localhost:18790',dashboardApiUrl:'http://localhost:18790',pollInterval:3000,agentCount:6,officeWidth:90,officeDepth:90,frustumSize:80};
let scene,camera,renderer,controls,agents=[],clock;
let officeObjects={monitors:[],plants:[],mugs:[],lamps:[],blinkLights:[],steamParticles:[],neonStrips:[],waterParticles:[],chairs:[],desks:[],hockeyBall:null};
let ambientLights={main:null,fill:null};
let timeOfDay=12,selectedAgent=null,raycaster,mouse,dustParticles,activityFeed=[];
let roomGroups={};
const STATUS_COLORS={active:0x00ff88,idle:0xffaa00,error:0xff4444,thinking:0x4488ff};
function init(){
  clock=new THREE.Clock();
  scene=new THREE.Scene();scene.background=new THREE.Color(0x1e2433);
  const aspect=window.innerWidth/window.innerHeight;
  camera=new THREE.OrthographicCamera(CONFIG.frustumSize*aspect/-2,CONFIG.frustumSize*aspect/2,CONFIG.frustumSize/2,CONFIG.frustumSize/-2,0.1,2000);
  camera.position.set(55,55,55);camera.lookAt(0,0,0);
  renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.getElementById('canvas-container').appendChild(renderer.domElement);
  controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
  controls.minZoom=0.25;controls.maxZoom=3;controls.maxPolarAngle=Math.PI/2.5;controls.minPolarAngle=Math.PI/6;controls.target.set(0,0,0);
  raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();
  createMainOffice();createHallway();createServerRoom();createGamingLounge();createKitchen();createRooftop();createExecutiveOffice();createSupplyCloset();createLoungeArea();createMeetingRoom();
  createLights();createDustParticles();createAgents();updateLighting();
  window.addEventListener('resize',onWindowResize);renderer.domElement.addEventListener('click',onMouseClick);
  document.getElementById('time-slider').addEventListener('input',onTimeChange);
  animate();pollGateway();initWeather();setInterval(pollGateway,CONFIG.pollInterval);
}
function mkMat(c,opts){opts=opts||{};return new THREE.MeshStandardMaterial(Object.assign({color:c},opts));}
function mkBox(w,h,d,c,opts){opts=opts||{};const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mkMat(c,opts));m.castShadow=true;m.receiveShadow=true;return m;}
function mkCyl(rt,rb,h,segs,c,opts){opts=opts||{};const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segs),mkMat(c,opts));m.castShadow=true;m.receiveShadow=true;return m;}
function mkSphere(r,segs,c,opts){return new THREE.Mesh(new THREE.SphereGeometry(r,segs,segs),mkMat(c,opts||{}));}
function add(g){for(var i=1;i<arguments.length;i++)g.add(arguments[i]);return g;}
function L(g){return g.children[g.children.length-1];}

function createMonitor() {
      const g = new THREE.Group();
      const screenMat = new THREE.MeshStandardMaterial({ color:0x111122, emissive:0x223344, emissiveIntensity:0.8 });
      const screen = new THREE.Mesh(new THREE.BoxGeometry(2,1.2,0.1), screenMat);
      screen.position.y = 0.5; g.add(screen);
      const contentMat = new THREE.MeshStandardMaterial({ color:0x334455, emissive:0x4466aa, emissiveIntensity:1.0 });
      const content = new THREE.Mesh(new THREE.BoxGeometry(1.8,1,0.05), contentMat);
      content.position.set(0,0.5,0.03); g.add(content);
      const standMat = new THREE.MeshStandardMaterial({ color:0x222222 });
      const stand = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.4,0.3), standMat);
      stand.position.y = -0.4; g.add(stand);
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.1,0.5), standMat);
      base.position.y = -0.65; g.add(base);
      g.userData.isMonitor = true;
      return g;
    }
function createCoffeeMug() {
      const g = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color:0xcc4444 });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.12,0.35,16), bodyMat);
      body.position.y = 0.175; g.add(body);
      const handle = new THREE.Mesh(new THREE.TorusGeometry(0.1,0.03,8,16,Math.PI), bodyMat);
      handle.rotation.y = Math.PI/2; handle.position.set(0.18,0.15,0); g.add(handle);
      g.userData.hasSteam = true;
      return g;
    }
function createDeskLamp() {
      const g = new THREE.Group();
      const baseMat = new THREE.MeshStandardMaterial({ color:0x444444 });
      g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,0.1,16), baseMat));
      g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.6,8), baseMat));
      const headMat = new THREE.MeshStandardMaterial({ color:0x666666, emissive:0xffffaa, emissiveIntensity:0.3 });
      const head = new THREE.Mesh(new THREE.ConeGeometry(0.15,0.2,16), headMat);
      head.position.y = 0.7; head.rotation.x = Math.PI; g.add(head);
      g.userData.isLamp = true;
      return g;
    }
function createPlant() {
      const g = new THREE.Group();
      const potMat = new THREE.MeshStandardMaterial({ color:0x8B4513 });
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.12,0.25,16), potMat);
      pot.position.y = 0.125; g.add(pot);
      const leafMat = new THREE.MeshStandardMaterial({ color:0x228B22 });
      for (let i = 0; i < 5; i++) {
        const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8), leafMat);
        const angle = (i/5)*Math.PI*2;
        leaf.position.set(Math.cos(angle)*0.1, 0.35+Math.random()*0.1, Math.sin(angle)*0.1);
        leaf.scale.y = 1.3; g.add(leaf);
      }
      g.userData.isPlant = true;
      return g;
    }
function createChair() {
      const g = new THREE.Group();
      const seatMat = new THREE.MeshStandardMaterial({ color:0x1a1a2e });
      const seat = new THREE.Mesh(new THREE.BoxGeometry(1,0.15,1), seatMat);
      seat.position.y = 1; seat.castShadow = true; g.add(seat);
      const back = new THREE.Mesh(new THREE.BoxGeometry(1,1,0.15), seatMat);
      back.position.set(0,1.5,-0.45); back.castShadow = true; g.add(back);
      const baseMat = new THREE.MeshStandardMaterial({ color:0x333333 });
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.1,16), baseMat);
      base.position.y = 0.05; g.add(base);
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.9,8), baseMat);
      pole.position.y = 0.55; g.add(pole);
      for (let i = 0; i < 5; i++) {
        const wheel = new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8), baseMat);
        const a = (i/5)*Math.PI*2;
        wheel.position.set(Math.cos(a)*0.25, 0.08, Math.sin(a)*0.25); g.add(wheel);
      }
      return g;
    }
function createAgents() {
      DESK_POSITIONS.forEach((pos, i) => {
        const agent = createAgent(i);
        agent.position.set(pos.x, 0, pos.z+1.5);
        scene.add(agent);
        agents.push(agent);
      });
    }

function createMainOffice(){
  var g=new THREE.Group();g.position.set(0,0,0);roomGroups['main']=g;
  add(g,mkBox(CONFIG.officeWidth,0.5,CONFIG.officeDepth,0x4a5a6a));L(g).position.y=-0.25;
  for(var x=-42;x<44;x+=2){for(var z=-42;z<44;z+=2){
    var light=(Math.floor(x/2)+Math.floor(z/2))%2===0;
    var tile=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.06,1.9),mkMat(light?0x3e3e50:0x363645));
    tile.position.set(x,0.03,z);tile.receiveShadow=true;g.add(tile);
  }}
  add(g,mkBox(CONFIG.officeWidth,9,0.5,0x3a4555));L(g).position.set(0,4.5,-44);
  add(g,mkBox(0.5,9,CONFIG.officeDepth,0x3a4555));L(g).position.set(-44,4.5,0);
  add(g,mkBox(0.5,9,CONFIG.officeDepth,0x3a4555));L(g).position.set(44,4.5,0);
  for(var i=0;i<6;i++){
    var wg=new THREE.Group();
    wg.add(mkBox(5,4,0.1,0x4488cc,{transparent:true,opacity:0.5,emissive:0x2244aa,emissiveIntensity:0.3}));
    wg.add(mkBox(5.4,0.3,0.2,0x555566));L(wg).position.y=2.15;
    wg.add(mkBox(5.4,0.3,0.2,0x555566));L(wg).position.y=-2.15;
    wg.position.set(-22+i*9,5,-43.75);g.add(wg);
  }
  var deskPos=[{x:-30,z:-25},{x:-30,z:-10},{x:-30,z:5},{x:-8,z:-25},{x:-8,z:-10},{x:-8,z:5}];
  deskPos.forEach(function(dp,i){
    var dg=new THREE.Group();dg.position.set(dp.x,0,dp.z);
    add(dg,mkBox(4.5,0.2,2.5,0x4a3728,{roughness:0.7}));L(dg).position.y=1.5;
    [[-2,0.75,-1],[2,0.75,-1],[-2,0.75,1],[2,0.75,1]].forEach(function(p){add(dg,mkBox(0.2,1.5,0.2,0x333333));L(dg).position.set(p[0],p[1],p[2]);});
    var mon=createMonitor();mon.position.set(0,2.3,-0.5);dg.add(mon);officeObjects.monitors.push(mon);
    add(dg,mkBox(1.2,0.1,0.4,0x2a2a2a));L(dg).position.set(0,1.65,0.5);
    add(dg,mkBox(0.2,0.1,0.3,0x2a2a2a));L(dg).position.set(1,1.65,0.5);
    var mug=createCoffeeMug();mug.position.set(1.5,1.75,-0.8);dg.add(mug);officeObjects.mugs.push(mug);
    var lamp=createDeskLamp();lamp.position.set(-1.5,1.6,-0.5);dg.add(lamp);officeObjects.lamps.push(lamp);
    if(i%2===0){var plant=createPlant();plant.position.set(-1.5,1.6,0.8);dg.add(plant);officeObjects.plants.push(plant);}
    g.add(dg);officeObjects.desks.push(dg);
    var chair=createChair();chair.position.set(dp.x,0,dp.z+2);g.add(chair);officeObjects.chairs.push(chair);
  });
  for(var x=-32;x<=-5;x+=8){for(var z=-28;z<=8;z+=7){
    add(g,mkBox(3.5,0.1,0.3,0xeeeeff,{emissive:0xeeeeff,emissiveIntensity:0.6}));L(g).position.set(x,8.9,z);
    var pl=new THREE.PointLight(0xeeeeff,0.4,10);pl.position.set(x,8.4,z);g.add(pl);
  }}
  scene.add(g);
}
function createHallway(){
  var g=new THREE.Group();g.position.set(14,0,0);roomGroups['hallway']=g;
  add(g,mkBox(10,0.5,60,0x5a5a68));L(g).position.y=-0.25;
  for(var x=-4;x<6;x+=2){for(var z=-28;z<32;z+=2){
    var light=(Math.floor(x/2)+Math.floor(z/2))%2===0;
    var tile=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.06,1.9),mkMat(light?0x4a4a58:0x404050));
    tile.position.set(x,0.03,z);tile.receiveShadow=true;g.add(tile);
  }}
  add(g,mkBox(0.5,9,60,0x4a5565));L(g).position.set(-5,4.5,0);
  add(g,mkBox(0.5,9,60,0x4a5565));L(g).position.set(5,4.5,0);
  add(g,mkBox(10,0.3,60,0x606070));L(g).position.y=9;
  for(var z=-26;z<=28;z+=8){
    add(g,mkBox(5,0.1,0.3,0xffffff,{emissive:0xffffff,emissiveIntensity:0.7}));L(g).position.set(0,8.9,z);
    var pl=new THREE.PointLight(0xffffff,0.35,10);pl.position.set(0,8.4,z);g.add(pl);
  }
  var doors=[{z:-18,label:'SERVER',color:0x00ccff},{z:-6,label:'GAMING',color:0xff44aa},{z:8,label:'KITCHEN',color:0xff8844},{z:22,label:'SUPPLY',color:0x888888}];
  doors.forEach(function(d){
    add(g,mkBox(0.15,7,2.8,0x666666));L(g).position.set(-4.75,3.5,d.z);
    add(g,mkBox(0.1,6.5,2.4,0x885522));L(g).position.set(-4.65,3.5,d.z);
    var handle=mkSphere(0.12,8,0xaaaaaa,{metalness:0.8,roughness:0.2});handle.position.set(-4.55,3.5,d.z+0.9);g.add(handle);
    add(g,mkBox(2.0,0.6,0.15,d.color,{emissive:d.color,emissiveIntensity:0.5}));L(g).position.set(-4.6,7.5,d.z);
  });
  var picColors=[0x6688cc,0x88aa66,0xcc6666,0xccaa44,0x8866aa,0x66aaaa,0xaa6688];
  for(var pz=-22;pz<=26;pz+=5){
    var pg=new THREE.Group();pg.add(mkBox(2.5,1.8,0.1,0x333333));
    pg.add(mkBox(2.2,1.5,0.05,picColors[Math.abs(pz)%picColors.length]));L(pg).position.z=0.03;
    pg.position.set(4.75,5,pz);g.add(pg);
  }
  for(var mz=-12;mz<=16;mz+=8){
    var mpg=new THREE.Group();
    mpg.add(mkBox(2,2.8,0.08,0x223344,{emissive:0x223344,emissiveIntensity:0.2}));
    mpg.add(mkBox(2,0.3,0.09,0x00ff88,{emissive:0x00ff88,emissiveIntensity:0.5}));L(mpg).position.y=1.25;
    for(var li=0;li<3;li++){mpg.add(mkBox(1.2,0.08,0.09,0x888899));L(mpg).position.set(-0.2,0.4-li*0.3,0.05);}
    mpg.position.set(-4.75,5,mz);g.add(mpg);
  }
  var fg=new THREE.Group();fg.position.set(0,0,-28);
  add(fg,mkCyl(0.6,0.8,1.2,16,0x888888));L(fg).position.y=0.6;
  add(fg,mkCyl(0.8,0.7,0.3,16,0x999999));L(fg).position.y=1.35;
  add(fg,mkCyl(0.1,0.15,0.5,8,0xaaaaaa));L(fg).position.set(0,1.5,-0.5);
  var wc=40;var wPos=new Float32Array(wc*3);var wVel=[];

function updateLighting(){
  var sunAngle=((timeOfDay-6)/12)*Math.PI;
  var mainIntensity,fillIntensity;var mainColor,fillColor;
  if(timeOfDay>=6&&timeOfDay<=18){
    var dayProgress=(timeOfDay-6)/12;
    mainIntensity=0.8+Math.sin(dayProgress*Math.PI)*0.7;fillIntensity=0.2+Math.sin(dayProgress*Math.PI)*0.2;
    mainColor=new THREE.Color(timeOfDay<9||timeOfDay>15?0xffaa66:0xffffff);
    fillColor=new THREE.Color(timeOfDay<9||timeOfDay>15?0x6666aa:0x8888ff);
  }else{mainIntensity=0.5;fillIntensity=0.4;mainColor=new THREE.Color(0x334488);fillColor=new THREE.Color(0x223355);}
  ambientLights.main.intensity=mainIntensity;ambientLights.main.color=mainColor;
  ambientLights.main.position.x=20*Math.cos(sunAngle);ambientLights.main.position.y=30*Math.abs(Math.sin(sunAngle))+5;
  ambientLights.fill.intensity=fillIntensity;ambientLights.fill.color=fillColor;
  var dayIntensity=Math.max(0,Math.sin(((timeOfDay-6)/12)*Math.PI));
  var bgColor=new THREE.Color().lerpColors(new THREE.Color(0x0d1020),new THREE.Color(0x6a7a8a),dayIntensity);
  scene.background=bgColor;
  var hours=Math.floor(timeOfDay);var mins=Math.floor((timeOfDay%1)*60);
  var timeStr=(hours.toString().padStart(2,'0')+':'+mins.toString().padStart(2,'0'));
  var icon=timeOfDay>=6&&timeOfDay<=18?'D':'N';var period=timeOfDay>=6&&timeOfDay<=18?'Day':'Night';
  document.getElementById('time-label').textContent=icon+' '+period+' - '+timeStr;
}

  geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
  var material=new THREE.PointsMaterial({color:0xffffff,size:0.05,transparent:true,opacity:0.4});

function updateDustParticles(){
  if(!dustParticles)return;
  var positions=dustParticles.geometry.attributes.position.array;var velocities=dustParticles.userData.velocities;
  for(var i=0;i<velocities.length;i++){
    positions[i*3]+=velocities[i].x;positions[i*3+1]+=velocities[i].y;positions[i*3+2]+=velocities[i].z;
    if(positions[i*3]>CONFIG.officeWidth/2)positions[i*3]=-CONFIG.officeWidth/2;
    if(positions[i*3]<-CONFIG.officeWidth/2)positions[i*3]=CONFIG.officeWidth/2;
    if(positions[i*3+1]>9)positions[i*3+1]=0;if(positions[i*3+1]<0)positions[i*3+1]=9;
    if(positions[i*3+2]>CONFIG.officeDepth/2)positions[i*3+2]=-CONFIG.officeDepth/2;
    if(positions[i*3+2]<-CONFIG.officeDepth/2)positions[i*3+2]=CONFIG.officeDepth/2;
  }
  dustParticles.geometry.attributes.position.needsUpdate=true;
}

async function pollGateway(){
  var urls=[CONFIG.gatewayUrl+'/api/sessions',CONFIG.dashboardApiUrl];var ok=false;
  for(var ui=0;ui<urls.length;ui++){try{var response=await fetch(urls[ui],{signal:AbortSignal.timeout(3000)});if(response.ok){var data=await response.json();updateFromGateway(data);ok=true;break;}}catch(e){}}
  if(!ok){updateConnectionStatus(false);updateDemoAgents();}
}
function updateFromGateway(data){
  var sessions=data.sessions||[];var activityEvents=[];
  agents.forEach(function(agent,i){var session=sessions[i]||sessions[i%sessions.length];if(session){var status='idle';if(session.isActive||session.behavior==='tool_use')status='active';else if(session.behavior==='thinking')status='thinking';else if(session.aborted)status='error';updateAgentStatus(agent,status,session);if(session.statusSummary)activityEvents.push({agent:session.name||'Agent '+(i+1),action:session.statusSummary,time:new Date().toLocaleTimeString()});}});
  if(activityEvents.length>0)updateTicker(activityEvents);
}
function updateDemoAgents(){
  var statuses=['active','idle','thinking','active','idle','active'];var names=['DuckBot','ResearchBot','CodeBot','TaskBot','MonitorBot','HelperBot'];var tasks=['Processing messages','Waiting for tasks','Analyzing patterns','Running jobs','Monitoring health','Assisting queries'];
  agents.forEach(function(agent,i){updateAgentStatus(agent,statuses[i],{name:names[i],model:'bailian/qwen3.5-plus',tokens:Math.floor(Math.random()*50000),task:tasks[i]});});
  if(Math.random()>0.7){var events=[{agent:names[Math.floor(Math.random()*names.length)],action:tasks[Math.floor(Math.random()*tasks.length)],time:new Date().toLocaleTimeString()}];updateTicker(events);}
}

function onMouseClick(event){
  var rect=renderer.domElement.getBoundingClientRect();mouse.x=((event.clientX-rect.left)/rect.width)*2-1;mouse.y=-((event.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);var intersects=raycaster.intersectObjects(agents,true);
  if(intersects.length>0){var obj=intersects[0].object;while(obj.parent&&obj.userData.agentIndex===undefined)obj=obj.parent;if(obj.userData.agentIndex!==undefined)showAgentPanel(obj);}
}

  selectedAgent=agent;var panel=document.getElementById('agent-panel');var data=agent.userData.agentData||{};
  document.getElementById('agent-name').textContent=data.name||'Agent '+(agent.userData.agentIndex+1);
  document.getElementById('agent-emoji').textContent=data.emoji||'E';
  var statusBadge=document.getElementById('agent-status');statusBadge.textContent=(agent.userData.status||'Active').charAt(0).toUpperCase()+(agent.userData.status||'Active').slice(1);
  statusBadge.style.background='#'+STATUS_COLORS[agent.userData.status||'active'].toString(16).padStart(6,'0');statusBadge.style.color='#fff';
  document.getElementById('agent-model').textContent=data.model||'-';
  document.getElementById('agent-tokens').textContent=data.tokens?data.tokens.toLocaleString():'-';
  document.getElementById('agent-task').textContent=data.task||data.statusSummary||'-';
  panel.classList.add('visible');
}
function closeAgentPanel(){document.getElementById('agent-panel').classList.remove('visible');selectedAgent=null;}
function onWindowResize(){var aspect=window.innerWidth/window.innerHeight;camera.left=CONFIG.frustumSize*aspect/-2;camera.right=CONFIG.frustumSize*aspect/2;camera.top=CONFIG.frustumSize/2;camera.bottom=CONFIG.frustumSize/-2;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);}
function onTimeChange(event){timeOfDay=parseFloat(event.target.value);updateLighting();}
function animate(){requestAnimationFrame(animate);var time=performance.now()*0.001;controls.update();updateAnimations(time);updateLighting();renderer.render(scene,camera);}
function initWeather(){var city=localStorage.getItem("ducklabs_city")||"Huber Heights,OH";document.getElementById("wx-city").textContent=city;fetchWx(city);setInterval(function(){fetchWx(city);},600000);document.getElementById("wx-city-wrap").addEventListener("click",function(){var f=document.getElementById("wx-edit");f.style.display=f.style.display==="block"?"none":"block";if(f.style.display==="block"){document.getElementById("wx-city-input").value=city;document.getElementById("wx-city-input").focus();}});document.getElementById("wx-save-btn").addEventListener("click",function(){var v=document.getElementById("wx-city-input").value.trim();if(v){city=v;localStorage.setItem("ducklabs_city",city);document.getElementById("wx-city").textContent=city;document.getElementById("wx-edit").style.display="none";fetchWx(city);}});document.getElementById("wx-city-input").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("wx-save-btn").click();if(e.key==="Escape")document.getElementById("wx-edit").style.display="none";});document.getElementById("settings-btn").addEventListener("click",function(){document.body.classList.toggle("panels-hidden");});}
function fetchWx(city){var icons={"Clear":"&#9728;","Sunny":"&#9728;","Partly cloudy":"&#127784;","Cloudy":"&#9729;","Overcast":"&#9729;","Mist":"&#127787;","Fog":"&#127787;","Light rain":"&#127783;","Moderate rain":"&#127783;","Heavy rain":"&#127783;","Rain":"&#127783;","Light snow":"&#127784;","Snow":"&#127784;","Thunderstorm":"&#9928;","Light drizzle":"&#127782;","drizzle":"&#127782;"};function icon(d){var k=(d||"").split(",")[0].trim();return icons[k]||"&#127777;";}fetch("https://wttr.in/"+encodeURIComponent(city)+"?format=j1",{signal:AbortSignal.timeout(5000)}).then(function(r){if(!r.ok)throw"bad";return r.json();}).then(function(j){var c=j.current_condition[0];document.getElementById("wx-content").innerHTML="<div class=\'wx-main\'><span class=\'wx-emoji\'>"+icon(c.weatherDesc[0].value)+"</span><span class=\'wx-temp\'>"+c.temp_C+"C</span></div><div class=\'wx-desc\'>"+c.weatherDesc[0].value+"</div><div class=\'wx-detail\'>&#128167; "+c.humidity+"% humidity &#127788; "+c.windspeedKmph+" km/h</div>";}).catch(function(e){document.getElementById("wx-content").innerHTML="<div class=\'wx-error\'>Weather unavailable</div><div class=\'wx-detail\'>Click city to change</div>";});}
try{init();console.log('OFFICE: init complete');}catch(e){document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;top:0;left:0;background:#300;color:#fff;padding:20px;font-family:monospace;z-index:9999">ERROR: '+e.message+'<pre>'+e.stack+'</pre></div>');}
<\/script>
