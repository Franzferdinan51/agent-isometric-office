<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duck Labs - Office</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;position:fixed;top:0;left:0}
#clock{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(10,10,30,.9);border:1px solid rgba(100,150,255,.25);border-radius:20px;padding:8px 20px;color:#fff;font-size:15px;font-weight:600;z-index:200;letter-spacing:1px}
#weather{position:fixed;top:20px;right:20px;background:rgba(10,10,30,.9);border:1px solid rgba(100,150,255,.25);border-radius:12px;padding:12px 16px;color:#e0e0e0;font-size:12px;z-index:200;min-width:190px}
.panel{background:rgba(10,10,30,.9);border:1px solid rgba(100,150,255,.25);border-radius:10px;padding:10px 14px;color:#e0e0e0;font-size:11px;margin-bottom:6px}
.panel-title{font-weight:700;color:#88aacc;margin-bottom:5px;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.dot{width:7px;height:7px;border-radius:50%;background:#00ffaa;box-shadow:0 0 6px #00ffaa;display:inline-block}
.wx-city{font-weight:700;font-size:11px;color:#88aacc;margin-bottom:4px;cursor:pointer}
.wx-main{display:flex;align-items:center;gap:6px}
.wx-temp{font-size:24px;font-weight:700;color:#fff}
.wx-desc{font-size:11px;color:#999;margin-bottom:2px}
.wx-detail{font-size:10px;color:#777}
.wx-edit{display:none;margin-top:6px}
.wx-edit input{background:rgba(255,255,255,.1);border:1px solid rgba(100,150,255,.3);border-radius:6px;color:#fff;padding:4px 8px;font-size:11px;width:130px}
.wx-edit button{background:rgba(100,150,255,.35);border:none;border-radius:6px;color:#fff;padding:4px 8px;font-size:11px;cursor:pointer;margin-left:4px}
#panels{position:fixed;bottom:20px;left:20px;z-index:100}
</style>
</head>
<body>
<div id="clock">--:--:-- --</div>
<div id="weather">
  <div class="wx-city" id="wx-city-wrap">&#128205; <span id="wx-city">Loading...</span></div>
  <div id="wx-content"><div class="wx-city">Fetching...</div></div>
  <div class="wx-edit" id="wx-edit"><input type="text" id="wx-city-input" placeholder="City"><button id="wx-save-btn">Save</button></div>
</div>
<div id="panels">
  <div class="panel"><div class="panel-title">&#9670; Agents Online</div><div id="agent-list"><span style="color:#777">Loading...</span></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
window.onerror=function(m){document.body.insertAdjacentHTML("beforeend","<div style='position:fixed;top:70px;left:0;right:0;background:#300;color:#fff;padding:12px;font-family:monospace;z-index:99999;font-size:13px'>ERROR: "+m+"</div>");};

var C={u:"http://localhost:18790",p:3000,n:6};
var O={m:[],P:[],L:[],b:[],a:[],desks:[],chairs:[],trees:[],bushes:[],flowers:[]};
var S,camera,R;

function vx(w,h,d,c,o){
  o=o||{};
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial(Object.assign({color:c},o)));
  m.castShadow=true;
  m.receiveShadow=true;
  return m;
}
function a(p,m){p.add(m);}
function cyl(r,h,c,o){
  o=o||{};
  var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,8),new THREE.MeshStandardMaterial(Object.assign({color:c},o)));
  m.castShadow=true;
  m.receiveShadow=true;
  return m;
}
function sphere(r,c,o){
  o=o||{};
  var m=new THREE.Mesh(new THREE.SphereGeometry(r,8,8),new THREE.MeshStandardMaterial(Object.assign({color:c},o)));
  m.castShadow=true;
  return m;
}
function L(g){return g.children[g.children.length-1];}

// ─── SCENE ───────────────────────────────────────────────────────────────
function initScene(){
  var asp=window.innerWidth/window.innerHeight;
  var fs=70;
  camera=new THREE.OrthographicCamera(fs*asp/-2,fs*asp/2,fs/2,fs/-2,0.1,2000);
  camera.position.set(70,70,70);
  camera.lookAt(0,0,0);
  R=new THREE.WebGLRenderer({antialias:true});
  R.setPixelRatio(Math.min(window.devicePixelRatio,2));
  R.setSize(window.innerWidth,window.innerHeight);
  R.shadowMap.enabled=true;
  R.shadowMap.type=THREE.PCFSoftShadowMap;
  R.domElement.style.position="fixed";
  R.domElement.style.top="0";
  R.domElement.style.left="0";
  document.body.appendChild(R.domElement);
  S=new THREE.Scene();
  S.background=new THREE.Color(0x87ceeb);
  S.fog=new THREE.Fog(0x87ceeb,120,280);
  S.add(new THREE.AmbientLight(0xffffff,0.55));
  var sun=new THREE.DirectionalLight(0xfff5e0,0.85);
  sun.position.set(60,100,50);
  sun.castShadow=true;
  sun.shadow.mapSize.width=2048;
  sun.shadow.mapSize.height=2048;
  sun.shadow.camera.near=1;
  sun.shadow.camera.far=400;
  sun.shadow.camera.left=-120;
  sun.shadow.camera.right=120;
  sun.shadow.camera.top=120;
  sun.shadow.camera.bottom=-120;
  S.add(sun);
}

// ─── HELPERS ─────────────────────────────────────────────────────────────
function mkDesk(){
  var g=new THREE.Group();
  a(g,vx(4.5,0.25,2.5,0x8a6a4a,{roughness:0.8}));
  g.children[0].position.y=0.125;
  g.children[0].receiveShadow=true;
  [[-2,-0.9],[-2,0.9],[2,-0.9],[2,0.9]].forEach(function(p){
    a(g,vx(0.2,1,0.2,0x5a3a20));
    g.children[g.children.length-1].position.set(p[0],-0.5,p[1]);
  });
  return g;
}
function mkChair(){
  var g=new THREE.Group();
  a(g,vx(1,0.15,1,0x4a3a2a));
  g.children[0].position.y=0.9;
  a(g,vx(1,1.1,0.15,0x4a3a2a));
  g.children[1].position.set(0,1.5,-0.42);
  [[-0.35,0.4,-0.35],[0.35,0.4,-0.35],[-0.35,0.4,0.35],[0.35,0.4,0.35]].forEach(function(p){
    a(g,vx(0.15,0.8,0.15,0x3a2a1a));
    g.children[g.children.length-1].position.set(p[0],p[1],p[2]);
  });
  return g;
}
function mkMonitor(){
  var g=new THREE.Group();
  a(g,vx(0.2,0.8,0.2,0x222222));
  g.children[0].position.y=0.7;
  a(g,vx(2.2,1.5,0.15,0x0a0a15));
  g.children[1].position.set(0,1.85,-0.55);
  var sm=new THREE.Mesh(new THREE.BoxGeometry(2,1.3,0.05),new THREE.MeshStandardMaterial({color:0x111122,emissive:0x112244,emissiveIntensity:0.9}));
  sm.position.set(0,1.85,-0.47);
  a(g,sm);
  g.userData.isMonitor=true;
  return g;
}
function mkLamp(){
  var g=new THREE.Group();
  a(g,vx(0.5,0.15,0.5,0x555555));
  g.children[0].position.y=0.075;
  a(g,vx(0.1,1.6,0.1,0x666666));
  g.children[1].position.y=0.875;
  a(g,vx(0.7,0.3,0.7,0xffeeaa,{emissive:0xffeeaa,emissiveIntensity:0.85}));
  g.children[2].position.y=1.9;
  g.userData.isLamp=true;
  return g;
}
function mkPlant(){
  var g=new THREE.Group();
  a(g,cyl(0.45,0.7,0x8B4513));
  g.children[0].position.y=0.35;
  a(g,sphere(0.65,0x2d8b2d,{roughness:0.9}));
  g.children[1].position.y=1.25;
  a(g,sphere(0.45,0x3daa3d,{roughness:0.9}));
  g.children[2].position.y=1.55;
  g.userData.isPlant=true;
  return g;
}
function mkMug(){
  var g=new THREE.Group();
  a(g,cyl(0.18,0.35,0xffffff,{roughness:0.3}));
  g.children[0].position.y=0.175;
  a(g,vx(0.08,0.08,0.35,0x4488cc,{roughness:0.4}));
  g.children[1].position.set(0.15,0.2,0);
  return g;
}
function mkAgent(col){
  col=col||0x88aacc;
  var g=new THREE.Group();
  a(g,vx(0.7,0.7,0.7,col));
  g.children[0].position.y=1.55;
  a(g,vx(0.85,0.85,0.85,0x4488cc));
  g.children[1].position.y=0.6;
  a(g,vx(0.5,0.5,0.5,0xffcc88));
  g.children[2].position.y=1.25;
  g.userData.isAgent=true;
  return g;
}
function mkTree(h){
  h=h||4;
  var g=new THREE.Group();
  a(g,vx(0.7,0.7,h,0x5a3a1a));
  g.children[0].position.y=h/2+0.35;
  var fy=h+0.35+h*0.35;
  a(g,vx(h*0.65,h*0.65,h*0.65,0x228B22));
  g.children[1].position.y=fy;
  a(g,vx(h*0.45,h*0.45,h*0.45,0x2d9b2d));
  g.children[2].position.y=fy+h*0.15;
  return g;
}
function mkBush(s){
  s=s||1;
  var g=new THREE.Group();
  a(g,vx(s,s*0.8,s,0x2d8b2d,{roughness:0.85}));
  g.children[0].position.y=s*0.4;
  return g;
}
function mkBench(){
  var g=new THREE.Group();
  a(g,vx(3,0.15,1,0x6a4a2a,{roughness:0.85}));
  g.children[0].position.y=0.8;
  a(g,vx(3,0.8,0.15,0x5a3a1a));
  g.children[1].position.set(0,1.3,-0.42);
  [[-1.3,0.4,-0.35],[1.3,0.4,-0.35],[-1.3,0.4,0.35],[1.3,0.4,0.35]].forEach(function(p){
    a(g,vx(0.15,0.8,0.15,0x4a2a10));
    g.children[g.children.length-1].position.set(p[0],p[1],p[2]);
  });
  return g;
}
function mkFountain(){
  var g=new THREE.Group();
  a(g,cyl(2.5,0.5,0x999999,{roughness:0.7}));
  g.children[0].position.y=0.25;
  a(g,cyl(2,0.4,0x888888,{roughness:0.6}));
  g.children[1].position.y=0.5;
  a(g,cyl(0.3,2.5,0xaaaaaa,{roughness:0.5}));
  g.children[2].position.y=1.75;
  a(g,sphere(0.4,0x3388cc,{transparent:true,opacity:0.7,emissive:0x3388cc,emissiveIntensity:0.3}));
  g.children[3].position.y=3.3;
  return g;
}

// ─── OUTDOOR ─────────────────────────────────────────────────────────────
function createOutdoor(){
  // Grass
  var ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x3a6a2a,roughness:0.9}));
  ground.rotation.x=-Math.PI/2;
  ground.receiveShadow=true;
  S.add(ground);

  // Gravel path through middle
  var path=new THREE.Mesh(new THREE.PlaneGeometry(5,200),new THREE.MeshStandardMaterial({color:0x8a7a6a,roughness:0.9}));
  path.rotation.x=-Math.PI/2;
  path.position.y=0.02;
  path.receiveShadow=true;
  S.add(path);

  // Parking area (right)
  var lot=new THREE.Mesh(new THREE.PlaneGeometry(30,25),new THREE.MeshStandardMaterial({color:0x4a4a4a,roughness:0.95}));
  lot.rotation.x=-Math.PI/2;
  lot.position.set(50,0.02,-30);
  lot.receiveShadow=true;
  S.add(lot);
  for(var pi=0;pi<4;pi++){
    var line=new THREE.Mesh(new THREE.PlaneGeometry(0.2,4.5),new THREE.MeshStandardMaterial({color:0xffffff}));
    line.rotation.x=-Math.PI/2;
    line.position.set(38+pi*5,0.03,-38);
    S.add(line);
  }

  // Garden area (right of building)
  var grav=new THREE.Mesh(new THREE.PlaneGeometry(35,40),new THREE.MeshStandardMaterial({color:0x9a8a7a,roughness:0.9}));
  grav.rotation.x=-Math.PI/2;
  grav.position.set(35,0.03,0);
  grav.receiveShadow=true;
  S.add(grav);

  // Fountain in garden
  var ft=mkFountain();
  ft.position.set(35,0,8);
  S.add(ft);

  // Trees along garden
  [[25,-8],[28,-12],[32,-14],[40,-10],[42,-6],[38,5],[30,3],[25,10],[42,12]].forEach(function(p){
    var t=mkTree(3+Math.floor(Math.random()*2));
    t.position.set(p[0],0,p[1]);
    t.scale.setScalar(0.8+Math.random()*0.4);
    S.add(t);
    O.trees.push(t);
  });

  // Bushes in garden
  for(var bj=0;bj<12;bj++){
    var bush=mkBush(0.8+Math.random()*0.5);
    bush.position.set(20+Math.random()*28,0.4,-15+Math.random()*28);
    S.add(bush);
    O.bushes.push(bush);
  }

  // Courtyard (left of building)
  var court=new THREE.Mesh(new THREE.PlaneGeometry(40,35),new THREE.MeshStandardMaterial({color:0x8a7a6a,roughness:0.85}));
  court.rotation.x=-Math.PI/2;
  court.position.set(-38,0.03,0);
  court.receiveShadow=true;
  S.add(court);

  // Benches in courtyard
  [[-30,-6],[-30,4],[-46,-6],[-46,4]].forEach(function(p){
    var bn=mkBench();
    bn.position.set(p[0],0,p[1]);
    S.add(bn);
  });

  // Trees in courtyard
  [[-50,-8],[-50,8],[-30,12],[-45,-14]].forEach(function(p){
    var t=mkTree(3+Math.floor(Math.random()*2));
    t.position.set(p[0],0,p[1]);
    S.add(t);
    O.trees.push(t);
  });

  // Bushes in courtyard
  for(var bk=0;bk<10;bk++){
    var bush=mkBush(0.7+Math.random()*0.5);
    bush.position.set(-55+Math.random()*30,0.35,-12+Math.random()*24);
    S.add(bush);
    O.bushes.push(bush);
  }
}

// ─── BUILDING ─────────────────────────────────────────────────────────────
function createBuilding(){
  var g=new THREE.Group();
  var WALL=0x8a7a6a;
  var WALL2=0x9a8a7a;
  var ROOF=0xcc6644;
  var WOOD=0x7a5a3a;
  var GLASS=0x88ccff;
  var FLOOR=0x7a6a5a;

  // Foundation slab
  a(g,vx(36,0.4,28,0x6a6a5a,{roughness:0.9}));
  g.children[g.children.length-1].position.y=-0.2;
  g.children[g.children.length-1].receiveShadow=true;

  // Floor
  a(g,vx(34,0.15,26,FLOOR,{roughness:0.8}));
  g.children[g.children.length-1].position.y=0.075;
  g.children[g.children.length-1].receiveShadow=true;

  // Walls - front and back
  for(var y=1;y<=5;y++){
    for(var x=-15;x<=15;x+=2){
      a(g,vx(1.9,1.9,0.35,WALL));
      g.children[g.children.length-1].position.set(x,y*2-0.9,-13.17);
      a(g,vx(1.9,1.9,0.35,WALL2));
      g.children[g.children.length-1].position.set(x,y*2-0.9,13.17);
    }
  }
  // Walls - left and right
  for(var y=1;y<=5;y++){
    for(var z=-11;z<=11;z+=2){
      a(g,vx(0.35,1.9,1.9,WALL));
      g.children[g.children.length-1].position.set(-17.17,y*2-0.9,z<0?z+3:z+5);
      a(g,vx(0.35,1.9,1.9,WALL2));
      g.children[g.children.length-1].position.set(17.17,y*2-0.9,z<0?z+5:z+3);
    }
  }

  // Roof
  a(g,vx(38,0.6,30,ROOF,{roughness:0.7}));
  g.children[g.children.length-1].position.set(0,11.3,0);

  // Roof detail - voxel tiles
  for(var rx=-16;rx<=16;rx+=2){
    for(var rz=-12;rz<=12;rz+=2){
      a(g,vx(1.9,0.3,1.9,0xaa5533));
      g.children[g.children.length-1].position.set(rx,11.75,rz);
    }
  }

  // Entrance door
  a(g,vx(3.5,4,0.3,WOOD,{roughness:0.7}));
  g.children[g.children.length-1].position.set(0,2,-13.3);
  a(g,vx(3.1,3.5,0.05,GLASS,{transparent:true,opacity:0.65,emissive:0x88ccff,emissiveIntensity:0.15}));
  g.children[g.children.length-1].position.set(0,2.2,-13.15);

  // Reception desk (inside entrance)
  var rd=mkDesk();
  rd.position.set(0,0,-8);
  rd.scale.setScalar(0.9);
  a(g,rd);
  O.desks.push(rd);
  var rm=mkMonitor();
  rm.position.set(0,1.6,-9);
  a(g,rm);
  O.m.push(rm);
  var ra=mkAgent(0x88aacc);
  ra.position.set(0,0,-6.5);
  a(g,ra);
  O.a.push(ra);

  // Main office area desks (3 rows of 3)
  var deskSpots=[
    {x:-8,z:-4},{x:0,z:-4},{x:8,z:-4},
    {x:-8,z:2},{x:0,z:2},{x:8,z:2},
    {x:-8,z:8},{x:0,z:8},{x:8,z:8}
  ];
  deskSpots.forEach(function(d,i){
    var desk=mkDesk();
    desk.position.set(d.x,0,d.z);
    a(g,desk);
    O.desks.push(desk);

    var mon=mkMonitor();
    mon.position.set(d.x,1.6,d.z-1);
    a(g,mon);
    O.m.push(mon);

    var chair=mkChair();
    chair.position.set(d.x,0,d.z+2.2);
    chair.rotation.y=Math.PI;
    a(g,chair);
    O.chairs.push(chair);

    var lamp=mkLamp();
    lamp.position.set(d.x-2,1.6,d.z-0.5);
    a(g,lamp);
    O.L.push(lamp);

    // Every other desk gets a plant
    if(i%2===0){
      var plant=mkPlant();
      plant.position.set(d.x+2,1.6,d.z+0.5);
      a(g,plant);
      O.P.push(plant);
    }

    // First row gets agents
    if(i<3){
      var ag=mkAgent(0x77aaee);
      ag.position.set(d.x+1.2,0,d.z+1.5);
      a(g,ag);
      O.a.push(ag);
    }
  });

  // Ceiling lights
  for(var lx=-10;lx<=10;lx+=10){
    for(var lz=-8;lz<=8;lz+=8){
      a(g,vx(1.5,0.1,1.5,0xeeeeff,{emissive:0xeeeeff,emissiveIntensity:1}));
      g.children[g.children.length-1].position.set(lx,9.9,lz);
      O.b.push(g.children[g.children.length-1]);
      var pl=new THREE.PointLight(0xffffff,0.35,15);
      pl.position.set(lx,9,lz);
      a(g,pl);
    }
  }

  // Window glow strips (front wall)
  for(var wy=2;wy<=8;wy+=4){
    for(var wx=-12;wx<=12;wx+=6){
      a(g,vx(1.5,0.15,0.05,0x88ccff,{emissive:0x88ccff,emissiveIntensity:0.6,transparent:true,opacity:0.8}));
      g.children[g.children.length-1].position.set(wx,wy,-13.1);
      O.b.push(g.children[g.children.length-1]);
    }
  }

  S.add(g);
}

// ─── ANIMATION ─────────────────────────────────────────────────────────────
var tickTime=0;
function tick(){
  try{
    tickTime+=0.016;
    O.m.forEach(function(mon,i){
      if(!mon||!mon.userData||!mon.userData.isMonitor)return;
      var s=mon.children[2];
      if(s&&s.material){
        s.material.emissiveIntensity=0.75+Math.sin(tickTime*1.8+i*0.9)*0.15+Math.random()*0.05;
      }
    });
    O.P.forEach(function(p,i){
      if(!p||!p.userData||!p.userData.isPlant)return;
      p.scale.setScalar(1+Math.sin(tickTime*0.4+i*1.1)*0.04);
    });
    O.L.forEach(function(l,i){
      if(!l||!l.userData||!l.userData.isLamp)return;
      var h=l.children[2];
      if(h&&h.material){
        h.material.emissiveIntensity=0.7+Math.sin(tickTime*0.6+i)*0.2;
      }
    });
    O.b.forEach(function(bl,i){
      if(!bl||!bl.material)return;
      bl.material.emissiveIntensity=(Math.sin(tickTime*2.2+i*1.6)>0.1)?0.95:0.05;
    });
    O.a.forEach(function(ag,i){
      if(!ag||!ag.userData||!ag.userData.isAgent)return;
      ag.rotation.y=Math.sin(tickTime*0.25+i*0.7)*0.12;
      ag.position.y=Math.sin(tickTime*0.8+i*1.2)*0.06;
    });
  }catch(e){}
}

// ─── UI ──────────────────────────────────────────────────────────────────
function updateClock(){
  var n=new Date();
  var h=n.getHours();
  var m=n.getMinutes().toString().padStart(2,"0");
  var s=n.getSeconds().toString().padStart(2,"0");
  var ampm=h>=12?"PM":"AM";
  var h12=h%12||12;
  document.getElementById("clock").textContent=h12+":"+m+":"+s+" "+ampm;
}
function fetchWx(city){
  fetch("https://wttr.in/"+encodeURIComponent(city)+"?format=j1",{signal:AbortSignal.timeout(5000)})
  .then(function(r){if(!r.ok)throw"bad";return r.json();})
  .then(function(j){
    var c=j.current_condition[0];
    var tf=c.temp_F!==undefined?c.temp_F:Math.round((parseInt(c.temp_C)*9/5)+32);
    var wm=c.windspeedMiles!==undefined?c.windspeedMiles:Math.round(parseInt(c.windspeedKmph)*0.621);
    document.getElementById("wx-content").innerHTML="<div class=wx-main><span class=wx-temp>"+tf+"F</span></div><div class=wx-desc>"+c.weatherDesc[0].value+"</div><div class=wx-detail>Humidity: "+c.humidity+"%  Wind: "+wm+" mph</div>";
  })
  .catch(function(){
    document.getElementById("wx-content").innerHTML="<div class=wx-city style=color:#f66>Unavailable</div>";
  });
}
function wxinit(){
  var city=localStorage.getItem("duck_city")||"Huber Heights,OH";
  document.getElementById("wx-city").textContent=city;
  fetchWx(city);
  setInterval(function(){fetchWx(city);},600000);
  document.getElementById("wx-city-wrap").addEventListener("click",function(){
    var f=document.getElementById("wx-edit");
    f.style.display=f.style.display==="block"?"none":"block";
    if(f.style.display==="block"){document.getElementById("wx-city-input").value=city;document.getElementById("wx-city-input").focus();}
  });
  document.getElementById("wx-save-btn").addEventListener("click",function(){
    var v=document.getElementById("wx-city-input").value.trim();
    if(v){city=v;localStorage.setItem("duck_city",city);document.getElementById("wx-city").textContent=city;document.getElementById("wx-edit").style.display="none";fetchWx(city);}
  });
}
async function poll(){
  try{
    var r=await fetch(C.u+"/sessions",{signal:AbortSignal.timeout(3000)});
    if(!r.ok)throw"no";
    var d=await r.json();
    var ss=d.sessions||[];
    var names=[...new Set(ss.map(function(s){return s.model||"Agent";}).filter(Boolean))];
    var html=names.length>0?names.map(function(n){return"<div><span class=dot></span> "+n+"</div>";}).join(""):"<span style=color:#777>"+C.n+" agents online</span>";
    document.getElementById("agent-list").innerHTML=html;
  }catch(e){
    document.getElementById("agent-list").innerHTML="<span style=color:#777>"+C.n+" agents online</span>";
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────
function start(){
  try{
    initScene();
    createOutdoor();
    createBuilding();
    wxinit();
    poll();
    setInterval(poll,C.p);
    setInterval(updateClock,1000);
    updateClock();
    window.addEventListener("resize",function(){
      var asp=window.innerWidth/window.innerHeight;
      var fs=70;
      camera.left=fs*asp/-2;camera.right=fs*asp/2;camera.top=fs/2;camera.bottom=fs/-2;
      camera.updateProjectionMatrix();
      R.setSize(window.innerWidth,window.innerHeight);
    });
    (function anim(){requestAnimationFrame(anim);tick();R.render(S,camera);})();
  }catch(e){
    document.body.insertAdjacentHTML("beforeend","<div style='position:fixed;top:70px;left:0;right:0;background:#300;color:#fff;padding:12px;font-family:monospace;z-index:99999'>FATAL: "+e.message+"</div>");
  }
}
start();

</script>
