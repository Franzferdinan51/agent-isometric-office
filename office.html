<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Labs - Isometric Office</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #87ceeb;
            font-family: 'Courier New', monospace;
        }
        #canvas { display: block; }
        
        /* UI Panels - Dark Glass Style */
        .panel {
            position: absolute;
            background: rgba(10,10,30,0.9);
            border: 1px solid rgba(100,150,255,0.25);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        #clock-panel {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            min-width: 200px;
        }
        #clock {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px rgba(100,150,255,0.5);
        }
        #date {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
        }
        
        #weather-panel {
            top: 20px;
            right: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #weather-panel:hover {
            transform: scale(1.02);
        }
        #weather-temp {
            font-size: 24px;
            font-weight: bold;
        }
        #weather-desc {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
        }
        #weather-city {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            margin-top: 2px;
        }
        
        #agent-panel {
            bottom: 20px;
            left: 20px;
            min-width: 250px;
        }
        #agent-count {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        #session-list {
            font-size: 12px;
            color: rgba(255,255,255,0.8);
            max-height: 150px;
            overflow-y: auto;
        }
        .session-item {
            padding: 4px 0;
            border-bottom: 1px solid rgba(100,150,255,0.1);
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(100,150,255,0.3); border-radius: 3px; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="clock-panel" class="panel">
        <div id="clock">--:--:--</div>
        <div id="date">Loading...</div>
    </div>
    
    <div id="weather-panel" class="panel" onclick="editCity()">
        <div id="weather-temp">--°F</div>
        <div id="weather-desc">--</div>
        <div id="weather-city">Click to set city</div>
    </div>
    
    <div id="agent-panel" class="panel">
        <div id="agent-count">🦆 Agents: <span id="agent-num">0</span></div>
        <div id="session-list">Loading sessions...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Globals
        C = { u: "http://localhost:18790", p: 3000, n: 6 };
        O = { monitors: [], plants: [], mugs: [], lamps: [], blinkLights: [], agents: [], desks: [], chairs: [] };
        
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        
        const camera = new THREE.OrthographicCamera(-50, 50, 50, -50, 0.1, 1000);
        camera.position.set(60, 60, 60);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 0.5;
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);
        
        // Helper functions
        function vx(w, h, d, c, opts = {}) {
            const geom = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshLambertMaterial({ color: c, ...opts });
            return new THREE.Mesh(geom, mat);
        }
        
        function add(g, ...meshes) {
            meshes.forEach(m => g.add(m));
            return g;
        }
        
        function L(g) {
            return g.children[g.children.length - 1];
        }
        
        // Material colors
        const COLORS = {
            wall: 0xD4C5B0,
            floor: 0x8B7355,
            plant: 0x4A7C59,
            desk: 0x6B5340,
            chair: 0x3a3a3a,
            monitor: 0x2a2a2a,
            monitorScreen: 0x4a90d9,
            lamp: 0xffd700,
            mug: 0xffffff,
            rug: 0x8B4513,
            cabinet: 0x5C4033,
            counter: 0x8B7355,
            couch: 0x4A7C59,
            table: 0x6B5340,
            whiteboard: 0xffffff,
            server: 0x2a2a2a,
            serverLed: 0x00ff00
        };
        
        // Factory functions
        function mkDesk() {
            const g = new THREE.Group();
            const top = vx(8, 0.5, 5, COLORS.desk);
            top.position.y = 3;
            const leg1 = vx(0.5, 3, 0.5, COLORS.desk);
            leg1.position.set(-3.5, 1.5, -2);
            const leg2 = vx(0.5, 3, 0.5, COLORS.desk);
            leg2.position.set(3.5, 1.5, -2);
            const leg3 = vx(0.5, 3, 0.5, COLORS.desk);
            leg3.position.set(-3.5, 1.5, 2);
            const leg4 = vx(0.5, 3, 0.5, COLORS.desk);
            leg4.position.set(3.5, 1.5, 2);
            add(g, top, leg1, leg2, leg3, leg4);
            return g;
        }
        
        function mkChair() {
            const g = new THREE.Group();
            const seat = vx(3, 0.3, 3, COLORS.chair);
            seat.position.y = 2;
            const back = vx(3, 2, 0.3, COLORS.chair);
            back.position.set(0, 3, -1.35);
            const leg1 = vx(0.3, 2, 0.3, COLORS.chair);
            leg1.position.set(-1.35, 1, -1.35);
            const leg2 = vx(0.3, 2, 0.3, COLORS.chair);
            leg2.position.set(1.35, 1, -1.35);
            const leg3 = vx(0.3, 2, 0.3, COLORS.chair);
            leg3.position.set(-1.35, 1, 1.35);
            const leg4 = vx(0.3, 2, 0.3, COLORS.chair);
            leg4.position.set(1.35, 1, 1.35);
            add(g, seat, back, leg1, leg2, leg3, leg4);
            return g;
        }
        
        function mkMonitor() {
            const g = new THREE.Group();
            const screen = vx(3, 2, 0.2, COLORS.monitor);
            screen.position.y = 4.5;
            const screenGlow = vx(2.8, 1.8, 0.21, COLORS.monitorScreen);
            screenGlow.position.y = 4.5;
            screenGlow.material = new THREE.MeshBasicMaterial({ color: COLORS.monitorScreen, emissive: COLORS.monitorScreen, emissiveIntensity: 0.3 });
            const stand = vx(0.3, 1.5, 0.3, COLORS.monitor);
            stand.position.y = 3;
            const base = vx(1.5, 0.2, 1, COLORS.monitor);
            base.position.y = 2.1;
            add(g, screen, screenGlow, stand, base);
            O.monitors.push(screenGlow);
            return g;
        }
        
        function mkPlant() {
            const g = new THREE.Group();
            const pot = vx(1.5, 1.5, 1.5, 0x8B4513);
            pot.position.y = 0.75;
            const leaves1 = vx(1, 1, 1, COLORS.plant);
            leaves1.position.y = 2;
            const leaves2 = vx(0.8, 0.8, 0.8, COLORS.plant);
            leaves2.position.set(0.5, 2.5, 0.3);
            const leaves3 = vx(0.8, 0.8, 0.8, COLORS.plant);
            leaves3.position.set(-0.5, 2.3, -0.3);
            add(g, pot, leaves1, leaves2, leaves3);
            g.userData.phase = Math.random() * Math.PI * 2;
            O.plants.push(g);
            return g;
        }
        
        function mkMug() {
            const g = new THREE.Group();
            const mug = vx(0.8, 1, 0.8, COLORS.mug);
            mug.position.y = 0.5;
            const handle = vx(0.2, 0.6, 0.5, COLORS.mug);
            handle.position.set(0.5, 0.5, 0);
            add(g, mug, handle);
            O.mugs.push(g);
            return g;
        }
        
        function mkAgent(color = 0xff6b6b) {
            const g = new THREE.Group();
            const body = vx(1.5, 2, 1, color);
            body.position.y = 1;
            const head = vx(1.2, 1.2, 1.2, color);
            head.position.y = 2.6;
            const eyes = vx(0.3, 0.3, 0.2, 0xffffff);
            eyes.position.set(0.3, 2.7, 0.6);
            const eyes2 = vx(0.3, 0.3, 0.2, 0xffffff);
            eyes2.position.set(-0.3, 2.7, 0.6);
            add(g, body, head, eyes, eyes2);
            g.userData.phase = Math.random() * Math.PI * 2;
            O.agents.push(g);
            return g;
        }
        
        function mkRug(w, d, c) {
            const rug = vx(w, 0.1, d, c);
            return rug;
        }
        
        function mkBookshelf() {
            const g = new THREE.Group();
            const frame = vx(6, 8, 1.5, COLORS.cabinet);
            frame.position.y = 4;
            const shelf1 = vx(5.5, 0.2, 1.3, COLORS.cabinet);
            shelf1.position.set(0, 2, 0);
            const shelf2 = vx(5.5, 0.2, 1.3, COLORS.cabinet);
            shelf2.position.set(0, 4, 0);
            const shelf3 = vx(5.5, 0.2, 1.3, COLORS.cabinet);
            shelf3.position.set(0, 6, 0);
            add(g, frame, shelf1, shelf2, shelf3);
            return g;
        }
        
        function mkCouch() {
            const g = new THREE.Group();
            const base = vx(8, 1.5, 3, COLORS.couch);
            base.position.y = 0.75;
            const back = vx(8, 3, 1, COLORS.couch);
            back.position.set(0, 2.25, -1);
            const arm1 = vx(1, 2, 3, COLORS.couch);
            arm1.position.set(-3.5, 1, 0);
            const arm2 = vx(1, 2, 3, COLORS.couch);
            arm2.position.set(3.5, 1, 0);
            add(g, base, back, arm1, arm2);
            return g;
        }
        
        function mkCoffeeTable() {
            const g = new THREE.Group();
            const top = vx(5, 0.3, 3, COLORS.table);
            top.position.y = 1.5;
            const leg1 = vx(0.3, 1.5, 0.3, COLORS.table);
            leg1.position.set(-2, 0.75, -1);
            const leg2 = vx(0.3, 1.5, 0.3, COLORS.table);
            leg2.position.set(2, 0.75, -1);
            const leg3 = vx(0.3, 1.5, 0.3, COLORS.table);
            leg3.position.set(-2, 0.75, 1);
            const leg4 = vx(0.3, 1.5, 0.3, COLORS.table);
            leg4.position.set(2, 0.75, 1);
            add(g, top, leg1, leg2, leg3, leg4);
            return g;
        }
        
        function mkTree(h) {
            const g = new THREE.Group();
            const trunk = vx(1, h * 0.4, 1, 0x5C4033);
            trunk.position.y = h * 0.2;
            const leaves1 = vx(3, 2, 3, COLORS.plant);
            leaves1.position.y = h * 0.5;
            const leaves2 = vx(2.5, 1.5, 2.5, COLORS.plant);
            leaves2.position.y = h * 0.7;
            const leaves3 = vx(2, 1, 2, COLORS.plant);
            leaves3.position.y = h * 0.85;
            add(g, trunk, leaves1, leaves2, leaves3);
            g.userData.phase = Math.random() * Math.PI * 2;
            O.plants.push(g);
            return g;
        }
        
        function mkCeilingLight() {
            const g = new THREE.Group();
            const fixture = vx(2, 0.3, 2, 0x888888);
            fixture.position.y = 0.15;
            const bulb = vx(1.5, 0.5, 1.5, 0xffffcc);
            bulb.position.y = -0.2;
            bulb.material = new THREE.MeshBasicMaterial({ color: 0xffffcc, emissive: 0xffffcc, emissiveIntensity: 0.5 });
            add(g, fixture, bulb);
            O.blinkLights.push(bulb);
            return g;
        }
        
        function mkWhiteboard() {
            const g = new THREE.Group();
            const board = vx(8, 4, 0.2, COLORS.whiteboard);
            board.position.y = 3;
            const frame = vx(8.4, 4.4, 0.1, 0x333333);
            frame.position.y = 3;
            const tray = vx(8, 0.3, 0.3, 0x333333);
            tray.position.set(0, 0.85, 0.15);
            add(g, board, frame, tray);
            return g;
        }
        
        function mkKitchenCounter() {
            const g = new THREE.Group();
            const counter = vx(12, 3, 4, COLORS.counter);
            counter.position.y = 1.5;
            const cabinet1 = vx(3, 2.8, 3.8, COLORS.cabinet);
            cabinet1.position.set(-4, 1.4, 0);
            const cabinet2 = vx(3, 2.8, 3.8, COLORS.cabinet);
            cabinet2.position.set(4, 1.4, 0);
            const sink = vx(2, 0.5, 1.5, 0x888888);
            sink.position.set(0, 2.9, 0);
            const coffee = vx(1.5, 2, 1.5, 0x2a2a2a);
            coffee.position.set(6, 2.5, 0);
            add(g, counter, cabinet1, cabinet2, sink, coffee);
            return g;
        }
        
        function mkServerRack() {
            const g = new THREE.Group();
            const frame = vx(4, 10, 3, COLORS.server);
            frame.position.y = 5;
            for (let i = 0; i < 8; i++) {
                const server = vx(3.8, 1, 2.8, 0x333333);
                server.position.set(0, 1 + i * 1.2, 0);
                const led = vx(0.3, 0.2, 0.1, COLORS.serverLed);
                led.position.set(1.5, 1 + i * 1.2, 1.5);
                led.material = new THREE.MeshBasicMaterial({ color: COLORS.serverLed, emissive: COLORS.serverLed, emissiveIntensity: 0.8 });
                add(g, server, led);
                O.blinkLights.push(led);
            }
            return g;
        }
        
        // Build the office
        function buildOffice() {
            // Floor
            const floor = vx(80, 1, 80, COLORS.floor);
            scene.add(floor);
            
            // Main Office Room
            const mainOffice = new THREE.Group();
            mainOffice.position.set(0, 0, 0);
            
            // Walls
            const backWall = vx(40, 12, 1, COLORS.wall);
            backWall.position.set(0, 6, -20);
            const leftWall = vx(1, 12, 40, COLORS.wall);
            leftWall.position.set(-20, 6, 0);
            const rightWall = vx(1, 12, 40, COLORS.wall);
            rightWall.position.set(20, 6, 0);
            const frontWall = vx(40, 12, 1, COLORS.wall);
            frontWall.position.set(0, 6, 20);
            add(mainOffice, backWall, leftWall, rightWall, frontWall);
            
            // Rug under desks
            const rug = mkRug(25, 15, COLORS.rug);
            rug.position.set(0, 0.15, 0);
            mainOffice.add(rug);
            
            // Desks in 2 rows of 3
            const deskPositions = [
                [-10, 0, -5], [0, 0, -5], [10, 0, -5],
                [-10, 0, 8], [0, 0, 8], [10, 0, 8]
            ];
            
            deskPositions.forEach((pos, i) => {
                const desk = mkDesk();
                desk.position.set(...pos);
                mainOffice.add(desk);
                O.desks.push(desk);
                
                const monitor = mkMonitor();
                monitor.position.set(0, 3.1, -1);
                desk.add(monitor);
                
                const chair = mkChair();
                chair.position.set(0, 0, 3);
                mainOffice.add(chair);
                O.chairs.push(chair);
                
                // Plant every other desk
                if (i % 2 === 0) {
                    const plant = mkPlant();
                    plant.position.set(4, 0.1, -2);
                    desk.add(plant);
                    
                    const mug = mkMug();
                    mug.position.set(-3, 3.2, 1);
                    desk.add(mug);
                }
                
                // Lamp on each desk
                const lamp = mkCeilingLight();
                lamp.scale.set(0.5, 0.5, 0.5);
                lamp.position.set(0, 6, 0);
                desk.add(lamp);
            });
            
            // Agents at desks (3-4 agents)
            const agentColors = [0xff6b6b, 0x4ecdc4, 0x45b7d1, 0xf7b731];
            for (let i = 0; i < 4; i++) {
                const agent = mkAgent(agentColors[i]);
                agent.position.set(deskPositions[i][0], 0, deskPositions[i][1] + 2);
                mainOffice.add(agent);
            }
            
            // Whiteboard on wall
            const wb1 = mkWhiteboard();
            wb1.position.set(0, 0.1, -19.5);
            wb1.rotation.y = Math.PI;
            mainOffice.add(wb1);
            
            // Bookshelf
            const bookshelf = mkBookshelf();
            bookshelf.position.set(-19, 0.1, 10);
            bookshelf.rotation.y = Math.PI / 2;
            mainOffice.add(bookshelf);
            
            // Ceiling lights
            for (let x = -15; x <= 15; x += 10) {
                for (let z = -15; z <= 15; z += 10) {
                    const light = mkCeilingLight();
                    light.position.set(x, 11, z);
                    mainOffice.add(light);
                }
            }
            
            scene.add(mainOffice);
            
            // Kitchen (right side)
            const kitchen = new THREE.Group();
            kitchen.position.set(35, 0, -10);
            
            const kFloor = vx(20, 1, 15, COLORS.floor);
            kitchen.add(kFloor);
            
            const kCounter = mkKitchenCounter();
            kCounter.position.set(0, 0.1, -5);
            kitchen.add(kCounter);
            
            const kTable = vx(6, 2.5, 4, COLORS.table);
            kTable.position.set(-5, 1.25, 3);
            kitchen.add(kTable);
            
            for (let i = 0; i < 4; i++) {
                const kChair = mkChair();
                const angle = (i / 4) * Math.PI * 2;
                kChair.position.set(Math.cos(angle) * 4, 0, 3 + Math.sin(angle) * 2);
                kChair.rotation.y = -angle;
                kitchen.add(kChair);
            }
            
            const kLight = mkCeilingLight();
            kLight.position.set(-5, 11, 3);
            kitchen.add(kLight);
            
            scene.add(kitchen);
            
            // Lounge (back left)
            const lounge = new THREE.Group();
            lounge.position.set(-35, 0, 25);
            
            const lFloor = vx(20, 1, 20, COLORS.floor);
            lounge.add(lFloor);
            
            const couch = mkCouch();
            couch.position.set(-5, 0.1, -7);
            lounge.add(couch);
            
            const coffeeTable = mkCoffeeTable();
            coffeeTable.position.set(0, 0.1, 0);
            lounge.add(coffeeTable);
            
            const lBookshelf = mkBookshelf();
            lBookshelf.position.set(9, 0.1, -5);
            lBookshelf.rotation.y = -Math.PI / 2;
            lounge.add(lBookshelf);
            
            const lPlant1 = mkTree(6);
            lPlant1.position.set(-8, 0.1, 8);
            lounge.add(lPlant1);
            
            const lPlant2 = mkTree(5);
            lPlant2.position.set(8, 0.1, 8);
            lounge.add(lPlant2);
            
            // 2 agents sitting in lounge
            const loungeAgent1 = mkAgent(0x9b59b6);
            loungeAgent1.position.set(-3, 0.1, -4);
            lounge.add(loungeAgent1);
            
            const loungeAgent2 = mkAgent(0xe67e22);
            loungeAgent2.position.set(3, 0.1, -4);
            lounge.add(loungeAgent2);
            
            const lLight = mkCeilingLight();
            lLight.position.set(0, 11, 0);
            lounge.add(lLight);
            
            scene.add(lounge);
            
            // Meeting Room (front left)
            const meeting = new THREE.Group();
            meeting.position.set(-35, 0, -25);
            
            const mFloor = vx(15, 1, 20, COLORS.floor);
            meeting.add(mFloor);
            
            const mTable = vx(10, 2.5, 4, COLORS.table);
            mTable.position.set(0, 1.25, 0);
            meeting.add(mTable);
            
            for (let i = 0; i < 5; i++) {
                const mChair = mkChair();
                if (i < 3) {
                    mChair.position.set(-5.5, 0, -4 + i * 4);
                    mChair.rotation.y = Math.PI / 2;
                } else {
                    mChair.position.set(5.5, 0, -6 + (i - 3) * 4);
                    mChair.rotation.y = -Math.PI / 2;
                }
                meeting.add(mChair);
            }
            
            const mWb = mkWhiteboard();
            mWb.position.set(-7, 0.1, 0);
            mWb.rotation.y = Math.PI / 2;
            meeting.add(mWb);
            
            // 1-2 agents in meeting room
            const mAgent1 = mkAgent(0x2ecc71);
            mAgent1.position.set(-3, 0, -2);
            meeting.add(mAgent1);
            
            const mLight = mkCeilingLight();
            mLight.position.set(0, 11, 0);
            meeting.add(mLight);
            
            scene.add(meeting);
            
            // Server Room (small, minimal)
            const serverRoom = new THREE.Group();
            serverRoom.position.set(35, 0, 25);
            
            const sFloor = vx(15, 1, 15, 0x333333);
            serverRoom.add(sFloor);
            
            // 2-4 server racks only
            for (let i = 0; i < 3; i++) {
                const rack = mkServerRack();
                rack.position.set(-5 + i * 5, 0.1, 0);
                serverRoom.add(rack);
            }
            
            const sLight = mkCeilingLight();
            sLight.position.set(0, 11, 0);
            serverRoom.add(sLight);
            
            scene.add(serverRoom);
        }
        
        // UI Functions
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
            const dateStr = now.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
            document.getElementById('clock').textContent = timeStr;
            document.getElementById('date').textContent = dateStr;
        }
        
        function getCity() {
            return localStorage.getItem('duck_city') || 'Huber Heights,OH';
        }
        
        async function fetchWeather() {
            const city = getCity();
            try {
                const res = await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1`);
                const data = await res.json();
                const current = data.current_condition[0];
                const tempF = current.temp_F;
                const windMph = current.windspeedMiles;
                const desc = current.weatherDesc[0].value;
                document.getElementById('weather-temp').textContent = `${tempF}°F`;
                document.getElementById('weather-desc').textContent = `${desc} • ${windMph} mph wind`;
                document.getElementById('weather-city').textContent = city;
            } catch (e) {
                document.getElementById('weather-temp').textContent = '--°F';
                document.getElementById('weather-desc').textContent = 'Unavailable';
                document.getElementById('weather-city').textContent = city;
            }
        }
        
        function editCity() {
            const current = getCity();
            const newCity = prompt('Enter city for weather (e.g., "New York,NY"):', current);
            if (newCity && newCity.trim()) {
                localStorage.setItem('duck_city', newCity.trim());
                fetchWeather();
            }
        }
        
        async function fetchSessions() {
            try {
                const res = await fetch(C.u + '/sessions');
                const data = await res.json();
                const sessions = data.sessions || [];
                document.getElementById('agent-num').textContent = sessions.length;
                const list = document.getElementById('session-list');
                if (sessions.length === 0) {
                    list.innerHTML = '<div class="session-item">No active sessions</div>';
                } else {
                    list.innerHTML = sessions.map(s => 
                        `<div class="session-item">🦆 ${s.model || 'agent'} • ${(s.tokens || 0).toLocaleString()} tokens</div>`
                    ).join('');
                }
            } catch (e) {
                document.getElementById('agent-num').textContent = '?';
                document.getElementById('session-list').innerHTML = '<div class="session-item">Session API unavailable</div>';
            }
        }
        
        // Animation
        function tick() {
            try {
                const time = Date.now() * 0.001;
                
                // Animate agents (gentle bob/sway)
                O.agents.forEach(agent => {
                    const phase = agent.userData.phase || 0;
                    agent.position.y = Math.sin(time * 2 + phase) * 0.1;
                    agent.rotation.y = Math.sin(time * 1.5 + phase) * 0.05;
                });
                
                // Animate monitors (emissive pulse)
                O.monitors.forEach(m => {
                    if (m && m.material) {
                        m.material.emissiveIntensity = 0.3 + Math.sin(time * 3) * 0.1;
                    }
                });
                
                // Animate plants (subtle scale breathe)
                O.plants.forEach(plant => {
                    const phase = plant.userData.phase || 0;
                    const scale = 1 + Math.sin(time * 1.5 + phase) * 0.02;
                    plant.scale.set(scale, scale, scale);
                });
                
                // Animate ceiling lights (gentle emissive flicker)
                O.blinkLights.forEach(light => {
                    if (light && light.material) {
                        light.material.emissiveIntensity = 0.5 + Math.sin(time * 5 + Math.random()) * 0.1;
                    }
                });
                
                controls.update();
                renderer.render(scene, camera);
            } catch (e) {
                console.error('Animation error:', e);
            }
            requestAnimationFrame(tick);
        }
        
        // Window resize
        window.addEventListener('resize', () => {
            camera.left = -window.innerWidth / 15;
            camera.right = window.innerWidth / 15;
            camera.top = window.innerHeight / 15;
            camera.bottom = -window.innerHeight / 15;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Initialize
        buildOffice();
        updateClock();
        fetchWeather();
        fetchSessions();
        
        setInterval(updateClock, 1000);
        setInterval(fetchWeather, 300000); // 5 minutes
        setInterval(fetchSessions, 5000); // 5 seconds
        
        tick();
    </script>
</body>
</html>
