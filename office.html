<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Isometric Office</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0a0a0f; 
      overflow: hidden; 
      font-family: 'Courier New', monospace;
    }
    canvas { 
      display: block; 
      image-rendering: pixelated; 
      image-rendering: crisp-edges;
    }
    .overlay-panel {
      position: absolute;
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid rgba(79, 195, 247, 0.3);
      border-radius: 4px;
      padding: 12px 16px;
      color: #4FC3F7;
      font-size: 12px;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    #clock-panel {
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      min-width: 200px;
    }
    #clock-time {
      font-size: 24px;
      font-weight: bold;
      color: #fff;
    }
    #clock-date {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
    #weather-panel {
      top: 20px;
      right: 20px;
      cursor: pointer;
      min-width: 180px;
    }
    #weather-panel:hover {
      border-color: rgba(79, 195, 247, 0.6);
    }
    #weather-temp {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
    }
    #weather-desc {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
    #agent-panel {
      bottom: 20px;
      left: 20px;
      min-width: 220px;
      max-height: 200px;
      overflow-y: auto;
    }
    #agent-panel h3 {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .agent-item {
      display: flex;
      align-items: center;
      padding: 4px 0;
      font-size: 11px;
    }
    .agent-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
      background: #4FC3F7;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .agent-name {
      color: #ccc;
    }
    .agent-status {
      margin-left: auto;
      color: #666;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
    ::-webkit-scrollbar-thumb { background: rgba(79, 195, 247, 0.3); border-radius: 2px; }
  </style>
</head>
<body>
  <canvas id="office"></canvas>
  
  <div id="clock-panel" class="overlay-panel">
    <div id="clock-time">--:--:--</div>
    <div id="clock-date">Loading...</div>
  </div>
  
  <div id="weather-panel" class="overlay-panel" onclick="editCity()">
    <div id="weather-temp">--°F</div>
    <div id="weather-desc">Click to set city</div>
  </div>
  
  <div id="agent-panel" class="overlay-panel">
    <h3>Active Agents</h3>
    <div id="agent-list">Loading...</div>
  </div>

  <script>
    const canvas = document.getElementById('office');
    const ctx = canvas.getContext('2d');
    
    // Isometric constants
    const TILE_W = 48;
    const TILE_H = 24;
    let MAP_OFFSET_X = canvas.width / 2;
    const MAP_OFFSET_Y = 80;
    const COLS = 19;
    const ROWS = 14;
    
    // Resize handler
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      MAP_OFFSET_X = canvas.width / 2;
    }
    window.addEventListener('resize', resize);
    resize();
    
    // Grid to screen conversion
    function g2s(col, row) {
      return {
        x: MAP_OFFSET_X + (col - row) * (TILE_W / 2),
        y: MAP_OFFSET_Y + (col + row) * (TILE_H / 2)
      };
    }
    
    // Draw isometric tile
    function drawIsoTile(ctx, col, row, color) {
      var p = g2s(col, row);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - TILE_H / 2);
      ctx.lineTo(p.x + TILE_W / 2, p.y);
      ctx.lineTo(p.x, p.y + TILE_H / 2);
      ctx.lineTo(p.x - TILE_W / 2, p.y);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }
    
    // Draw isometric block (3D cube)
    function drawIsoBlock(ctx, col, row, h, topC, leftC, rightC) {
      var p = g2s(col, row);
      // Top
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - TILE_H / 2 - h);
      ctx.lineTo(p.x + TILE_W / 2, p.y - h);
      ctx.lineTo(p.x, p.y + TILE_H / 2 - h);
      ctx.lineTo(p.x - TILE_W / 2, p.y - h);
      ctx.closePath();
      ctx.fillStyle = topC;
      ctx.fill();
      // Left
      ctx.beginPath();
      ctx.moveTo(p.x - TILE_W / 2, p.y - h);
      ctx.lineTo(p.x, p.y + TILE_H / 2 - h);
      ctx.lineTo(p.x, p.y + TILE_H / 2);
      ctx.lineTo(p.x - TILE_W / 2, p.y);
      ctx.closePath();
      ctx.fillStyle = leftC;
      ctx.fill();
      // Right
      ctx.beginPath();
      ctx.moveTo(p.x + TILE_W / 2, p.y - h);
      ctx.lineTo(p.x, p.y + TILE_H / 2 - h);
      ctx.lineTo(p.x, p.y + TILE_H / 2);
      ctx.lineTo(p.x + TILE_W / 2, p.y);
      ctx.closePath();
      ctx.fillStyle = rightC;
      ctx.fill();
    }
    
    // Pixel rect helper
    function px(ctx, x, y, w, h, c) {
      ctx.fillStyle = c;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }
    
    // Draw floor
    function drawFloor() {
      for (let col = 0; col < COLS; col++) {
        for (let row = 0; row < ROWS; row++) {
          const color = (col + row) % 2 === 0 ? '#C4A882' : '#B0956E';
          drawIsoTile(ctx, col, row, color);
        }
      }
    }
    
    // Draw desk
    function drawDesk(ctx, col, row, tick) {
      drawIsoBlock(ctx, col, row, 14, '#8D6E63', '#6D4C41', '#5D4037');
      // Monitor on desk
      var p = g2s(col, row);
      px(ctx, p.x - 6, p.y - 20, 12, 10, '#333');
      px(ctx, p.x - 4, p.y - 18, 8, 6, '#4FC3F7');
    }
    
    // Draw chair
    function drawChair(ctx, col, row) {
      var p = g2s(col, row);
      px(ctx, p.x - 5, p.y - 8, 10, 2, '#555');
      px(ctx, p.x - 2, p.y - 6, 4, 8, '#444');
      px(ctx, p.x - 6, p.y - 12, 2, 6, '#444');
    }
    
    // Draw monitor
    function drawMonitor(ctx, col, row, tick) {
      var p = g2s(col, row);
      // Frame
      px(ctx, p.x - 8, p.y - 25, 16, 14, '#222');
      // Screen glow
      px(ctx, p.x - 6, p.y - 23, 12, 10, '#4FC3F7');
      // Code lines
      if (Math.floor(tick / 30) % 2 === 0) {
        px(ctx, p.x - 4, p.y - 21, 8, 1, '#fff');
        px(ctx, p.x - 4, p.y - 18, 6, 1, '#fff');
        px(ctx, p.x - 4, p.y - 15, 7, 1, '#fff');
      }
      // Stand
      px(ctx, p.x - 3, p.y - 11, 6, 4, '#444');
      px(ctx, p.x - 5, p.y - 7, 10, 2, '#444');
    }
    
    // Draw plant
    function drawPlant(ctx, col, row, tick) {
      var p = g2s(col, row);
      // Pot
      px(ctx, p.x - 5, p.y - 10, 10, 8, '#D84315');
      px(ctx, p.x - 4, p.y - 9, 8, 6, '#F57C00');
      // Leaves (swaying)
      var sway = Math.sin(tick * 0.08) * 2;
      px(ctx, p.x - 6 + sway, p.y - 18, 4, 8, '#2E7D32');
      px(ctx, p.x + 2 + sway, p.y - 16, 4, 7, '#388E3C');
      px(ctx, p.x - 2 + sway, p.y - 20, 4, 6, '#43A047');
    }
    
    // Draw bookshelf
    function drawBookshelf(ctx, col, row) {
      var p = g2s(col, row);
      // Frame
      px(ctx, p.x - 10, p.y - 30, 20, 28, '#4E342E');
      px(ctx, p.x - 9, p.y - 29, 18, 26, '#5D4037');
      // Shelves
      px(ctx, p.x - 9, p.y - 20, 18, 2, '#3E2723');
      px(ctx, p.x - 9, p.y - 10, 18, 2, '#3E2723');
      // Books (colored)
      px(ctx, p.x - 8, p.y - 18, 3, 8, '#E53935');
      px(ctx, p.x - 4, p.y - 18, 3, 8, '#1E88E5');
      px(ctx, p.x, p.y - 18, 3, 8, '#43A047');
      px(ctx, p.x + 4, p.y - 18, 3, 8, '#FB8C00');
      px(ctx, p.x - 8, p.y - 8, 3, 8, '#8E24AA');
      px(ctx, p.x - 4, p.y - 8, 3, 8, '#00ACC1');
      px(ctx, p.x, p.y - 8, 4, 8, '#FDD835');
    }
    
    // Draw whiteboard
    function drawWhiteboard(ctx, col, row, tick) {
      var p = g2s(col, row);
      // Frame
      px(ctx, p.x - 12, p.y - 25, 24, 20, '#555');
      // Board
      px(ctx, p.x - 11, p.y - 24, 22, 18, '#fff');
      // Diagram (blue)
      px(ctx, p.x - 8, p.y - 20, 16, 1, '#2196F3');
      px(ctx, p.x - 8, p.y - 16, 16, 1, '#2196F3');
      px(ctx, p.x - 8, p.y - 12, 16, 1, '#2196F3');
      // Red dot (animated)
      if (Math.floor(tick / 20) % 2 === 0) {
        px(ctx, p.x + 6, p.y - 18, 3, 3, '#F44336');
      }
    }
    
    // Draw sofa
    function drawSofa(ctx, col, row) {
      var p = g2s(col, row);
      // Seat
      px(ctx, p.x - 14, p.y - 8, 28, 10, '#5C6BC0');
      // Back
      px(ctx, p.x - 14, p.y - 18, 28, 10, '#3F51B5');
      // Armrests
      px(ctx, p.x - 16, p.y - 8, 4, 10, '#3949AB');
      px(ctx, p.x + 12, p.y - 8, 4, 10, '#3949AB');
    }
    
    // Draw coffee table
    function drawCoffeeTable(ctx, col, row) {
      var p = g2s(col, row);
      drawIsoBlock(ctx, col, row, 8, '#6D4C41', '#5D4037', '#4E342E');
      // Magazine
      px(ctx, p.x - 6, p.y - 12, 12, 1, '#E53935');
      px(ctx, p.x - 6, p.y - 10, 12, 1, '#fff');
      // Cup
      px(ctx, p.x + 4, p.y - 10, 4, 4, '#fff');
    }
    
    // Draw coffee machine
    function drawCoffeeMachine(ctx, col, row, tick) {
      var p = g2s(col, row);
      // Body
      px(ctx, p.x - 8, p.y - 20, 16, 18, '#424242');
      px(ctx, p.x - 7, p.y - 19, 14, 16, '#616161');
      // Blinking light
      if (Math.floor(tick / 15) % 2 === 0) {
        px(ctx, p.x - 4, p.y - 16, 3, 3, '#4CAF50');
      } else {
        px(ctx, p.x - 4, p.y - 16, 3, 3, '#2E7D32');
      }
      // Steam particles
      if (tick % 30 < 15) {
        px(ctx, p.x - 2, p.y - 24, 2, 4, 'rgba(255,255,255,0.5)');
        px(ctx, p.x + 2, p.y - 26, 2, 4, 'rgba(255,255,255,0.3)');
      }
    }
    
    // Draw server rack
    function drawServerRack(ctx, col, row, tick) {
      var p = g2s(col, row);
      // Body
      px(ctx, p.x - 10, p.y - 35, 20, 33, '#212121');
      px(ctx, p.x - 9, p.y - 34, 18, 31, '#424242');
      // Server units (4)
      for (let i = 0; i < 4; i++) {
        let sy = p.y - 30 + i * 7;
        px(ctx, p.x - 8, sy, 16, 5, '#333');
        // Blinking LEDs
        if ((tick + i * 5) % 20 < 10) {
          px(ctx, p.x - 6, sy + 1, 2, 2, '#4CAF50');
          px(ctx, p.x - 2, sy + 1, 2, 2, '#2196F3');
        } else {
          px(ctx, p.x - 6, sy + 1, 2, 2, '#1B5E20');
          px(ctx, p.x - 2, sy + 1, 2, 2, '#0D47A1');
        }
      }
    }
    
    // Draw rug
    function drawRug(ctx, col, row) {
      var p = g2s(col, row);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - TILE_H / 2 + 2);
      ctx.lineTo(p.x + TILE_W / 2 - 2, p.y);
      ctx.lineTo(p.x, p.y + TILE_H / 2 - 2);
      ctx.lineTo(p.x - TILE_W / 2 + 2, p.y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(156, 39, 176, 0.4)';
      ctx.fill();
    }
    
    // Draw agent
    function drawAgent(ctx, col, row, tick, color) {
      var p = g2s(col, row);
      var sway = Math.sin(tick * 0.05) * 1;
      var by = p.y + sway;
      // Body
      px(ctx, p.x - 8, by - 20, 16, 16, color);
      // Head
      px(ctx, p.x - 6, by - 30, 12, 12, 0xffcc88);
      // Eyes
      px(ctx, p.x - 3, by - 27, 2, 2, 0x222222);
      px(ctx, p.x + 1, by - 27, 2, 2, 0x222222);
      // Legs
      px(ctx, p.x - 6, by - 4, 4, 6, 0x334455);
      px(ctx, p.x + 2, by - 4, 4, 6, 0x334455);
    }
    
    // Weather state
    let weatherCity = '45424';
    let weatherData = { temp: '--', desc: 'Loading...' };
    
    // Fetch weather
    async function fetchWeather() {
      try {
        const res = await fetch('https://wttr.in/' + weatherCity + '?format=j1');
        const data = await res.json();
        if (data.current_condition) {
          weatherData.temp = Math.round(data.current_condition[0].temp_F);
          weatherData.desc = data.current_condition[0].weatherDesc[0].value;
          document.getElementById('weather-temp').textContent = weatherData.temp + '°F';
          document.getElementById('weather-desc').textContent = weatherData.desc;
        }
      } catch (e) {
        document.getElementById('weather-desc').textContent = 'Click to set city';
      }
    }
    
    function editCity() {
      const city = prompt('Enter city or ZIP:', weatherCity);
      if (city) {
        weatherCity = city;
        fetchWeather();
      }
    }
    
    // Update clock
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
      const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('clock-time').textContent = timeStr;
      document.getElementById('clock-date').textContent = dateStr;
    }
    
    // Fetch agents
    async function fetchAgents() {
      try {
        const res = await fetch('http://localhost:18790/sessions');
        const data = await res.json();
        const list = document.getElementById('agent-list');
        if (data && data.sessions && data.sessions.length > 0) {
          list.innerHTML = data.sessions.slice(0, 5).map(s => 
            '<div class="agent-item"><div class="agent-dot"></div><span class="agent-name">' + 
            (s.name || s.id || 'Agent') + '</span><span class="agent-status">●</span></div>'
          ).join('');
        } else {
          list.innerHTML = '<div class="agent-item"><span class="agent-name">No active agents</span></div>';
        }
      } catch (e) {
        document.getElementById('agent-list').innerHTML = '<div class="agent-item"><span class="agent-name">Gateway offline</span></div>';
      }
    }
    
    // Render scene
    function render(tick) {
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      drawFloor();
      
      // Main office desks
      drawDesk(ctx, 3, 3, tick);
      drawDesk(ctx, 3, 6, tick);
      drawDesk(ctx, 3, 9, tick);
      drawDesk(ctx, 11, 3, tick);
      drawDesk(ctx, 11, 6, tick);
      drawDesk(ctx, 11, 9, tick);
      
      // Agents at desks
      drawAgent(ctx, 3.5, 4, tick, '#E53935');
      drawAgent(ctx, 3.5, 7, tick, '#1E88E5');
      drawAgent(ctx, 3.5, 10, tick, '#43A047');
      drawAgent(ctx, 11.5, 4, tick, '#FB8C00');
      drawAgent(ctx, 11.5, 7, tick, '#8E24AA');
      drawAgent(ctx, 11.5, 10, tick, '#00ACC1');
      
      // Bookshelf
      drawBookshelf(ctx, 7, 3);
      
      // Plants scattered
      drawPlant(ctx, 1, 5, tick);
      drawPlant(ctx, 17, 8, tick);
      drawPlant(ctx, 9, 12, tick);
      
      // Whiteboards on walls
      drawWhiteboard(ctx, 5, 1, tick);
      drawWhiteboard(ctx, 13, 1, tick);
      
      // Kitchen area
      drawIsoBlock(ctx, 16, 6, 12, '#9E9E9E', '#757575', '#616161');
      drawCoffeeMachine(ctx, 17, 5, tick);
      drawIsoBlock(ctx, 16, 9, 10, '#8D6E63', '#6D4C41', '#5D4037');
      
      // Lounge area
      drawRug(ctx, 3, 11);
      drawSofa(ctx, 3, 11);
      drawCoffeeTable(ctx, 3, 12);
      drawAgent(ctx, 3, 11.5, tick, '#FDD835');
      drawAgent(ctx, 4, 11.5, tick, '#FF7043');
      
      // Meeting area
      drawIsoBlock(ctx, 3, 3, 10, '#5D4037', '#4E342E', '#3E2723');
      drawChair(ctx, 2, 2);
      drawChair(ctx, 4, 2);
      drawChair(ctx, 2, 4);
      drawChair(ctx, 4, 4);
      
      // Server room
      drawServerRack(ctx, 14, 11, tick);
      drawServerRack(ctx, 15, 11, tick);
      
      // Monitors on desks
      drawMonitor(ctx, 3, 3, tick);
      drawMonitor(ctx, 3, 6, tick);
      drawMonitor(ctx, 11, 6, tick);
      
      requestAnimationFrame(() => render(tick + 1));
    }
    
    // Initialize
    updateClock();
    setInterval(updateClock, 1000);
    fetchWeather();
    setInterval(fetchWeather, 300000);
    fetchAgents();
    setInterval(fetchAgents, 5000);
    
    // Start animation
    render(0);
  </script>
</body>
</html>
